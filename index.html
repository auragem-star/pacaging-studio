<script type="text/babel" data-presets="react">
const { useState, useRef, useLayoutEffect } = React;

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap');

.lp-root, .lp-root * { box-sizing: border-box; }
.lp-root {
  --paper: #E4E6E1;
  --panel: #F7F8F6;
  --ink: #16181C;
  --ink-soft: #5C6169;
  --rule: #C3C7C0;
  --cyan: #0091B3;
  --magenta: #C8005E;
  --amber: #B87400;

  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  min-height: 100vh;
  padding: 28px 20px 80px;
  direction: rtl;
}

.lp-shell { max-width: 1180px; margin: 0 auto; width: 100%; }
.lp-el { min-width: 0; }
.lp-elbody { overflow-wrap: anywhere; }

/* ---------- masthead ---------- */
.lp-head {
  border-bottom: 2px solid var(--ink);
  padding-bottom: 14px;
  margin-bottom: 26px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.lp-head > div { min-width: 0; flex: 1 1 260px; }
.lp-title {
  font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans Arabic', sans-serif;
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin: 0;
}
.lp-sub { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 0; max-width: 46ch; line-height: 1.6; }
.lp-stamp {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  padding: 5px 9px;
  white-space: nowrap;
  direction: ltr;
}

/* ---------- eyebrow ---------- */
.lp-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
}
.lp-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.lp-eyebrow b { color: var(--magenta); font-weight: 600; }

/* ---------- input ---------- */
.lp-inputwrap { background: var(--panel); border: 1px solid var(--rule); padding: 18px; margin-bottom: 14px; }
.lp-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; }
.lp-hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.6; }
.lp-ta {
  width: 100%;
  min-height: 190px;
  resize: vertical;
  background: #fff;
  border: 1px solid var(--rule);
  padding: 12px;
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--ink);
  box-sizing: border-box;
}
.lp-ta:focus { outline: 2px solid var(--cyan); outline-offset: -1px; }

.lp-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.lp-btn {
  background: var(--ink); color: var(--paper); border: none;
  padding: 11px 22px; font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.lp-btn:hover:not(:disabled) { background: var(--magenta); }
.lp-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.lp-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.lp-btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); font-weight: 500; padding: 10px 16px; }
.lp-btn-ghost:hover:not(:disabled) { background: #fff; border-color: var(--ink); color: var(--ink); }

.lp-err { border-right: 3px solid var(--magenta); background: #fff; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-top: 12px; }

.lp-keychk, .lp-keyok, .lp-keybad { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.lp-keychk { color: var(--ink-soft); }
.lp-keyok { color: #1E7A3C; }
.lp-keybad { color: var(--magenta); white-space: normal; }
.lp-keymodel {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-style: normal;

}

/* ---------- tabs ---------- */
.lp-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin: 30px 0 20px; flex-wrap: wrap; }
.lp-tab {

}
.lp-tab:hover { color: var(--ink); }
.lp-tab[data-on="1"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--magenta); }
.lp-tab span { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); margin-inline-start: 6px; }

/* ---------- element list ---------- */
.lp-facegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }
.lp-face { background: var(--panel); border: 1px solid var(--rule); }
.lp-facehead {
  padding: 10px 14px; border-bottom: 1px solid var(--rule);
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; display: flex; justify-content: space-between;
}
.lp-el { padding: 12px 14px; border-bottom: 1px solid var(--rule); display: flex; gap: 12px; }
.lp-el:last-child { border-bottom: none; }
.lp-elnum { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--cyan); padding-top: 3px; min-width: 22px; }
.lp-elbody { flex: 1; min-width: 0; }
.lp-elen { font-size: 13.5px; font-weight: 600; direction: ltr; text-align: left; word-break: break-word; }
.lp-elar { font-size: 13.5px; margin-top: 3px; }
.lp-elnote { font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; line-height: 1.55; }
.lp-tag {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; border: 1px solid var(--rule); padding: 2px 5px; align-self: flex-start; color: var(--ink-soft);
}

/* ---------- prompts ---------- */
.lp-prompt { background: var(--panel); border: 1px solid var(--rule); padding: 16px; margin-bottom: 12px; }
.lp-phead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.lp-ptitle { font-size: 15px; font-weight: 600; margin: 0; }
.lp-pplace { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 10px; }
.lp-ptext {
  background: #fff; border: 1px solid var(--rule); padding: 12px;
  font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; line-height: 1.75;
  direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word;
}

/* ---------- dieline preview (signature) ---------- */
.lp-dlwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 26px; }
.lp-dlcol { display: flex; flex-direction: column; align-items: center; }
.lp-dlcap {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px;
}
.lp-dl { width: 100%; max-width: 300px; }
.lp-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; font-size: 12px; color: var(--ink-soft); }
.lp-lgi { display: flex; align-items: center; gap: 7px; }
.lp-sw { width: 22px; height: 11px; border: 1px solid var(--ink); display: inline-block; }

.lp-note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 14px; }

/* ---------- visual ai director ---------- */
.lp-vd { background: var(--panel); border: 1px solid var(--rule); margin-bottom: 14px; }
.lp-vdhead {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; flex-wrap: wrap; padding: 14px 16px 0;
}
.lp-vdkind {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--paper); background: var(--cyan);
  padding: 3px 7px; display: inline-block; margin-bottom: 6px;
}
.lp-vdname { font-size: 16px; font-weight: 600; margin: 0; }
.lp-vdmeta { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; padding: 12px 16px 0; }
.lp-vdcell { padding: 9px 0; }
.lp-vdcell dt {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px;
}
.lp-vdcell dd { margin: 0; font-size: 12.5px; line-height: 1.65; }
.lp-vdfoot { padding: 4px 16px 16px; }

/* ---------- concept ---------- */
.lp-ctrl { background: var(--panel); border: 1px solid var(--rule); padding: 16px; margin-bottom: 18px; }
.lp-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.lp-chip {
  background: #fff; border: 1px solid var(--rule); padding: 8px 13px;
  font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 12.5px;
  cursor: pointer; color: var(--ink-soft);
}
.lp-chip:hover { border-color: var(--ink); color: var(--ink); }
.lp-chip[data-on="1"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.lp-chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.lp-banner {
  border: 1px dashed var(--amber); background: #fff; padding: 11px 14px;
  font-size: 12px; line-height: 1.65; color: var(--ink); margin-bottom: 18px;
}
.lp-banner strong { color: var(--amber); }

.lp-cgrid { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 26px; align-items: start; }
@media (max-width: 720px) { .lp-cgrid { grid-template-columns: 1fr; } }

.lp-swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.lp-swatch { width: 92px; }
.lp-swbox { height: 46px; border: 1px solid var(--rule); }
.lp-swhex { font-family: 'IBM Plex Mono', monospace; font-size: 10px; margin-top: 4px; direction: ltr; text-align: left; }
.lp-swrole { font-size: 11px; color: var(--ink-soft); line-height: 1.4; }

.lp-dir { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 4px; }
.lp-dirq { font-size: 13px; font-weight: 600; margin: 12px 0 3px; }
.lp-dira { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin: 0; }

/* ---------- die-cut ---------- */
.lp-drop {
  border: 2px dashed var(--rule); background: #fff; padding: 26px 18px;
  text-align: center; cursor: pointer; display: block;
}
.lp-drop:hover { border-color: var(--ink); }
.lp-drop b { display: block; font-size: 14px; margin-bottom: 5px; }
.lp-drop span { font-size: 12px; color: var(--ink-soft); line-height: 1.7; }

.lp-dcgrid { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 720px) { .lp-dcgrid { grid-template-columns: 1fr; } }

.lp-dcprev {
  border: 1px solid var(--rule); background: #fff; padding: 12px;
  display: flex; align-items: center; justify-content: center; min-height: 190px;
}
.lp-dcprev svg { max-width: 100%; max-height: 260px; height: auto; }

.lp-readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
.lp-ro { border: 1px solid var(--rule); background: #fff; padding: 10px 12px; }
.lp-rok {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px;
}
.lp-rov { font-family: 'IBM Plex Mono', monospace; font-size: 16px; direction: ltr; text-align: left; }

.lp-fields { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.lp-field { flex: 1 1 110px; min-width: 100px; }
.lp-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
.lp-num {
  width: 100%; background: #fff; border: 1px solid var(--rule); padding: 9px 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; direction: ltr; text-align: left;
}
.lp-num:focus, .lp-sel:focus { outline: 2px solid var(--cyan); outline-offset: -1px; }
.lp-sel {
  width: 100%; background: #fff; border: 1px solid var(--rule); padding: 9px 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px;
}

.lp-shapes { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
.lp-shape {
  background: #fff; border: 1px solid var(--rule); padding: 7px 10px; cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); direction: ltr;
}
.lp-shape:hover { border-color: var(--ink); color: var(--ink); }
.lp-shape[data-on="1"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.lp-ok { border-right: 3px solid var(--cyan); background: #fff; padding: 12px 14px; font-size: 13px; line-height: 1.65; }

/* ---------- artwork upload ---------- */
.lp-artrow {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border: 1px solid var(--rule); background: #fff;
  padding: 9px 12px; margin-bottom: 8px;
}
.lp-artname { flex: 1 1 130px; min-width: 0; font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.lp-artmeta {
  display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 400; color: var(--ink-soft); margin-top: 3px; direction: ltr; text-align: left;
}
.lp-artrow .lp-btn { padding: 7px 12px; font-size: 12px; }

/* ---------- final mockup ---------- */
.lp-faces { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; }
.lp-facewrap { min-width: 0; }
.lp-facecap {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px;
}
.lp-sticker {
  border: 1px solid var(--rule); overflow: hidden; position: relative;
}
.lp-stickerin {
  position: absolute; top: 0; left: 0;
  transform-origin: top left;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.lp-pad { padding: 13px 15px; display: flex; flex-direction: column; gap: 11px; }
.lp-band { flex: 0 0 auto; }
.lp-logoslot { min-height: 38px; display: flex; align-items: center; justify-content: center; }
.lp-hair { height: 1px; width: 100%; }

.lp-sname {
  font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700;
  font-size: 27px; line-height: 1.05; letter-spacing: -0.015em;
  text-align: center; direction: ltr; overflow-wrap: anywhere;
}
.lp-sclaim {
  font-size: 11px; font-weight: 600; text-align: center; direction: ltr;
  line-height: 1.45; letter-spacing: 0.05em; text-transform: uppercase;
}
.lp-sbadge {
  align-self: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  letter-spacing: 0.1em; padding: 6px 14px; direction: ltr;
  border: 1.5px solid currentColor; border-radius: 999px; text-transform: uppercase;
}
.lp-hero { padding: 10px 12px; }

.lp-sechead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; direction: ltr; }
.lp-sechead span {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; white-space: nowrap;
}
.lp-sechead i { display: block; height: 1px; flex: 1; opacity: 0.35; }

.lp-sblock { direction: ltr; text-align: left; }
.lp-sbody { font-size: 10px; line-height: 1.65; opacity: 0.85; overflow-wrap: anywhere; }
.lp-slines { display: flex; flex-direction: column; gap: 4px; }
.lp-slines span { display: block; height: 3px; width: 100%; opacity: 0.15; }

.lp-strip { display: grid; gap: 8px; }

.lp-arspace {
  border: 1px dashed currentColor; padding: 9px; text-align: center; opacity: 0.5;
}
.lp-arspace span { display: block; font-size: 10px; }
.lp-arspace em { display: block; font-size: 9.5px; font-style: normal; margin-top: 3px; opacity: 0.8; }

.lp-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
  letter-spacing: 0.08em; direction: ltr; text-transform: uppercase;
}

.lp-order { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.lp-order span {
  border: 1px solid var(--rule); background: #fff; padding: 5px 10px; font-size: 12px;
}
.lp-order b {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--paper); background: var(--ink); padding: 1px 5px; margin-inline-end: 6px;
}

.lp-steps { margin: 10px 0 0; padding-inline-start: 20px; }
.lp-steps li { font-size: 12.5px; line-height: 1.75; color: var(--ink-soft); margin-bottom: 7px; }

/* ---------- product mockup ---------- */
.lp-mockgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-top: 14px; }
.lp-mockcol { min-width: 0; }
.lp-mockshot { border: 1px solid var(--rule); background: #fff; padding: 10px; margin-bottom: 10px; }
.lp-mockshot img { width: 100%; height: auto; max-height: 260px; object-fit: contain; display: block; }
.lp-mockout { border: 1px solid var(--ink); background: #fff; padding: 10px; margin-top: 10px; }
.lp-mockout img { width: 100%; height: auto; display: block; margin-bottom: 10px; }
.lp-mockout a { display: inline-block; text-decoration: none; }


.lp-slot { position: relative; display: flex; align-items: center; justify-content: center; }
.lp-slotimg { max-width: 100%; max-height: 190px; object-fit: contain; display: block; }
.lp-slotempty {
  width: 100%; height: 100%; min-height: inherit; border: 1px dashed currentColor;
  opacity: 0.5; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; cursor: pointer; padding: 10px 8px; text-align: center;
}
.lp-slotempty:hover { opacity: 0.85; }
.lp-slotempty b { font-size: 11px; }
.lp-slotempty span { font-size: 9.5px; }
.lp-slotx {
  position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; line-height: 1;
  border: 1px solid var(--rule); background: #fff; color: var(--ink);
  cursor: pointer; font-size: 14px; padding: 0;
}

/* Export mode — strip everything that belongs to the editor, not the label. */
.lp-sticker.lp-export .lp-slotx { display: none !important; }
.lp-sticker.lp-export .lp-slotempty { opacity: 0 !important; border-color: transparent !important; }
.lp-sticker.lp-export .lp-arspace { border-color: transparent !important; }
.lp-sticker.lp-export .lp-arspace span,
.lp-sticker.lp-export .lp-arspace em { visibility: hidden !important; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
`;

const SYS_SPLIT = `You break a product description into print-ready packaging label elements.

Return ONLY valid JSON. No markdown, no backticks, no preamble.

{
 "product":{"en":"...","ar":"..."},
 "front":[{"t":"element name EN","ar":"Arabic or empty","k":"logo|name|claim|badge|volume|art","n":"placement note, Egyptian Arabic, max 8 words"}],
 "back":[{"t":"...","ar":"...","k":"title|body|ingredients|usage|warning|storage|volume|art","n":"..."}]
}

Rules: front 6-7 items, back 6-7 items. Keep "t" under 5 words. Keep "ar" short (the label text itself, not a paragraph). Be extremely compact.`;

const SYS_PROMPTS = `You write AI image-generation prompts for pharmaceutical packaging artwork.

Return ONLY valid JSON. No markdown, no backticks, no preamble.

{"prompts":[{"title":"short EN title","face":"front|back","place":"where it goes, Egyptian Arabic, max 10 words","p":"English image prompt"}]}

Each "p" must describe photorealistic 3D pharmaceutical packaging artwork and end with: transparent background, isolated, no text, high resolution, 300 DPI

Rules: exactly 4 prompts. Keep each "p" under 45 words. Be compact.`;

const KINDS = [
  "Hero Ingredient Visual",
  "Supporting Ingredients",
  "Background / Environment Visual",
  "Decorative Elements",
  "Texture / Pattern",
  "Premium Visual Element",
];

const SYS_DIRECTOR = `You are an art director for product packaging. Analyse the product type, ingredients, nature and target audience, then propose ONLY the visual assets this specific product actually needs.

Return ONLY valid JSON. No markdown, no backticks, no preamble.

{"items":[{"kind":"one of: ${KINDS.join(" | ")}","name":"short EN asset name","why":"why this product needs it, Egyptian Arabic, max 14 words","role":"its job in the packaging design, Egyptian Arabic, max 12 words","place":"suggested placement, Egyptian Arabic, max 10 words","p":"English image-generation prompt"}]}

Prompt rules for "p": photorealistic and professional where the product warrants it; specify camera angle, lighting, material and visual detail when useful; no text, no logos, no brand names in the image; isolated subject or clean background so the asset drops into a label design; specific to THIS product, never generic. Under 50 words.

function extractJSON(raw) {
  const clean = raw.replace(/```json/g, "").replace(/```/g, "").trim();
  const s = clean.indexOf("{");
  const e = clean.lastIndexOf("}");
  if (s === -1 || e === -1 || e <= s) throw new Error("no-json");
  return JSON.parse(clean.slice(s, e + 1));
}

/* Google retires model IDs on a schedule, so each call walks a list
   newest-first and moves on when one returns 404. */
const TEXT_MODELS = ["gemini-2.5-flash", "gemini-1.5-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"];
const IMAGE_MODELS = ["gemini-3.1-flash-image", "gemini-3-pro-image", "gemini-2.5-flash-image"];

const isRetired = (msg) =>
  /http 404/.test(msg) || /no longer available|not found|is not supported/i.test(msg);

let GEMINI_KEYS = [];

  GEMINI_KEYS = (k || "").split(/[\s,\n]+/).map((x) => x.trim()).filter(Boolean);
};

async function askPollinations(system, user) {
  let res;
  try {
    res = await fetch("https://text.pollinations.ai/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [
          { role: "system", content: system },
          { role: "user", content: user }
        ],
        jsonMode: true
      }),
    });
  } catch (netErr) {
    throw new Error("network: " + (netErr.message || "fetch failed"));
  }
  if (!res.ok) throw new Error(`http ${res.status}`);
  const text = await res.text();
  return extractJSON(text);
}

async function askGeminiModelWithKey(key, model, system, user) {
  const url =
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` +
    encodeURIComponent(key);

  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `${system}\n\n---\n\nInput:\n${user}` }] }],
        generationConfig: {
          responseMimeType: "application/json",
          maxOutputTokens: 2048,
          temperature: 0.7,
        },
      }),
    });
  } catch (netErr) {
    throw new Error("blocked: " + (netErr.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try {
      const body = await res.json();
      detail = body?.error?.message || "";
    } catch { /* body was not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  const raw = (j?.candidates?.[0]?.content?.parts || [])
    .map((p) => p.text || "")
    .join("");
  if (!raw.trim()) throw new Error("empty response");
  return extractJSON(raw);
}

async function askGemini(system, user) {
  let last;
  const keys = GEMINI_KEYS.length ? GEMINI_KEYS : [""];
  for (const k of keys) {
    if (!k) continue;
    for (const m of TEXT_MODELS) {
      try {
        return await askGeminiModelWithKey(k, m, system, user);
      } catch (e) {
        last = e;
        const msg = e.message || "";
        // If retired, try next model with same key. If 429/403 rate limit, move to next key!
        if (msg.startsWith("http 429") || msg.startsWith("http 403")) break;
        if (!isRetired(msg)) throw e;
      }
    }
  }
  throw last;
}

async function askClaude(system, user) {
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          { role: "user", content: `${system}\n\n---\n\nInput:\n${user}` },
          { role: "assistant", content: "{" },
        ],
      }),
    });
  } catch (netErr) {
    throw new Error("network: " + (netErr.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try {
      const body = await res.json();
      detail = body?.error?.message || "";
    } catch { /* body was not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  if (j.error) throw new Error(j.error.message || "api-error");

  const raw = (j.content || []).map((c) => (c.type === "text" ? c.text : "")).join("");
  if (!raw.trim()) throw new Error("empty response");

  // The assistant turn was prefilled with "{", so it is not part of the reply.
  const whole = raw.trim().startsWith("{") ? raw : "{" + raw;

  if (j.stop_reason === "max_tokens") {
    try {
      return extractJSON(whole);
    } catch {
      throw new Error("truncated");
    }
  }
  return extractJSON(whole);
}

async function askModel(system, user) {
  if (GEMINI_KEYS.length > 0) {
    try {
      return await askGemini(system, user);
    } catch (e) {
      console.warn("Gemini keys failed, trying Pollinations free AI fallback...", e);
    }
  }
  try {
    return await askPollinations(system, user);
  } catch (e) {
    return await askClaude(system, user);
  }
}

async function askClaudeRetry(system, user, tries = 2) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      return await askModel(system, user);
    } catch (e) {
      last = e;
      const m = e.message || "";
      // A malformed or truncated reply is worth one more shot; a bad request is not.
      const retryable = m.includes("no-json") || m.includes("empty") ||
                        m.includes("network") || m.startsWith("http 5") ||
                        m.includes("overloaded") || m.startsWith("http 429");
      if (!retryable || i === tries - 1) throw last;
      await new Promise((r) => setTimeout(r, 900));
    }
  }
  throw last;
}

function friendlyError(e) {
  const m = (e && e.message) || "";
  if (m === "truncated") return "الوصف طويل فالرد اتقطع. اختصر الوصف وجرّب تاني.";
  if (m.includes("no-json")) return "الرد رجع بشكل مش متوقع. جرّب تاني.";
  if (m.includes("network")) return "مفيش اتصال بالسيرفر. اتأكد من النت وجرّب تاني.";
  if (m.startsWith("http 429")) return "الطلبات كتير دلوقتي. استنى شوية وجرّب تاني.";
  if (m.startsWith("http 4")) return "الطلب اترفض: " + m;
  if (m.startsWith("http 5")) return "السيرفر مش راد دلوقتي. جرّب تاني بعد شوية.";
  return "حصلت مشكلة: " + (m || "سبب غير معروف");
}

function parseBrief(text) {
  const t = (text || "").trim();
  const flat = t.replace(/\s+/g, " ");

  // Descriptions often open with a face marker like "FRONT" — that is a
  // section label, not the product name.
  const isMarker = (s) =>
    /^(front|back|face|الوش|الوجه|الضهر|الخلف|الأمامي|الخلفي)\s*[:：-]?\s*$/i.test(s.trim());

  const lines = t.split(/\n/).map((l) => l.trim()).filter(Boolean);
  let first = lines.find((l) => !isMarker(l)) || t;

  let name = first.split(/—|--| - |[:.]/)[0].trim();
  if (name.length > 60) name = name.slice(0, 60).trim();
  if (!name || isMarker(name)) name = "Product";

  // Ingredients: everything after an ingredients marker.
  let ingredients = [];
  const m = flat.match(/(?:ingredients|المكونات|مكونات)\s*[:：]\s*([^.]+)/i);
  if (m) {
    ingredients = m[1]
      .split(/[,،؛;]/)
      .map((x) => x.replace(/\band\b|\bو\b/gi, "").trim())
      .filter((x) => x.length > 1 && x.length < 48)
      .slice(0, 8);
  }

  const has = (re) => re.test(flat);
  const traits = {
    cooling: has(/cool|cold|freeze|menthol|بارد|تبريد|منثول/i),
    warming: has(/warm|heat|hot|دافئ|تدفئة|سخون/i),
    pain: has(/pain|ache|sore|muscle|joint|ألم|وجع|عضل|مفصل/i),
    skin: has(/skin|derma|face|cream|بشرة|جلد|وجه|كريم/i),
    hair: has(/hair|scalp|شعر|فروة/i),
    spray: has(/spray|mist|سبراي|بخاخ|رش/i),
    natural: has(/natural|herbal|botanic|organic|طبيعي|عشبي|نباتي/i),
    kids: has(/kid|child|baby|أطفال|طفل|بيبي/i),
  };

  const medical = traits.pain || has(/topical|relief|therapeutic|علاج|موضعي/i);
  const category = traits.hair ? "hair care"
    : traits.skin ? "skin care"
    : medical ? "topical relief"
    : "personal care";

  return { text: t, name, ingredients, traits, category, medical };
}

  for (const f of filler) {
    if (items.length >= 3) break;
    items.push(f);
  }

  return { items: items.slice(0, 4) };
}

/* ============================================================
   DIE-CUT ANALYSIS
   Geometry is measured from the file itself — SVG bounding boxes
   via getBBox(), PDF page boxes read from the file structure.
   Nothing here is inferred by a model.
   ============================================================ */

const TO_MM = { mm: 1, cm: 10, in: 25.4, pt: 25.4 / 72, pc: 25.4 / 6, px: 25.4 / 96 };
const UNITS = ["mm", "cm", "in", "pt", "px"];

function parseLen(v) {
  if (v === null || v === undefined) return null;
  const m = String(v).trim().match(/^(-?[\d.]+)\s*(mm|cm|in|pt|pc|px|%)?$/);
  if (!m) return null;
  const u = m[2] || "px";
  if (u === "%") return null;
  return { n: parseFloat(m[1]), u };
}

const toMM = (n, u) => n * (TO_MM[u] || TO_MM.px);
const fromMM = (mm, u) => mm / (TO_MM[u] || TO_MM.px);
const round1 = (n) => Math.round(n * 10) / 10;

function gcd(a, b) { return b < 0.0001 ? a : gcd(b, a % b); }
function ratioText(w, h) {
  if (!w || !h) return "—";
  const r = w / h;
  // Try a clean small-integer ratio first, else fall back to decimal.
  for (let d = 1; d <= 12; d++) {
    const n = r * d;
    if (Math.abs(n - Math.round(n)) < 0.02) return `${Math.round(n)}:${d}`;
  }
  return `${round1(r)}:1`;
}

function sanitizeSVG(markup) {
  return markup
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/\son\w+\s*=\s*"[^"]*"/gi, "")
    .replace(/\son\w+\s*=\s*'[^']*'/gi, "")
    .replace(/javascript:/gi, "");
}

function analyzeSVG(text) {
  const clean = sanitizeSVG(text);
  const doc = new DOMParser().parseFromString(clean, "image/svg+xml");
  const svg = doc.querySelector("svg");
  if (!svg) throw new Error("مش ملف SVG صالح");

  const vb = (svg.getAttribute("viewBox") || "").trim().split(/[\s,]+/).map(Number);
  const hasVB = vb.length === 4 && vb.every((n) => !isNaN(n));
  const wAttr = parseLen(svg.getAttribute("width"));
  const hAttr = parseLen(svg.getAttribute("height"));

  // Mount offscreen so getBBox() returns real rendered geometry.
  const host = document.createElement("div");
  host.setAttribute("style", "position:absolute;left:-99999px;top:0;width:0;height:0;overflow:hidden");
  document.body.appendChild(host);
  host.innerHTML = clean;
  const live = host.querySelector("svg");

  let shapes = [];
  try {
    const nodes = live.querySelectorAll("path, rect, circle, ellipse, polygon, polyline, line");
    nodes.forEach((el, i) => {
      let bb;
      try { bb = el.getBBox(); } catch { return; }
      if (!bb || bb.width < 0.01 || bb.height < 0.01) return;
      shapes.push({
        i,
        tag: el.tagName.toLowerCase(),
        id: el.getAttribute("id") || "",
        x: bb.x, y: bb.y, w: bb.width, h: bb.height,
        area: bb.width * bb.height,
      });
    });
  } finally {
    document.body.removeChild(host);
  }

  // User units per viewBox unit -> millimetres.
  let mmPerUnit = null;
  let confidence = "low";
  if (hasVB && wAttr && wAttr.u !== "px") {
    mmPerUnit = toMM(wAttr.n, wAttr.u) / vb[2];
    confidence = "high";
  } else if (!hasVB && wAttr && wAttr.u !== "px") {
    mmPerUnit = toMM(wAttr.n, wAttr.u) / wAttr.n;
    confidence = "high";
  } else if (hasVB && wAttr && wAttr.u === "px") {
    mmPerUnit = toMM(wAttr.n, "px") / vb[2];
    confidence = "assumed";
  }

  const artW = hasVB ? vb[2] : wAttr ? wAttr.n : null;
  const artH = hasVB ? vb[3] : hAttr ? hAttr.n : null;

  shapes.sort((a, b) => b.area - a.area);
  shapes = shapes.slice(0, 12);

  return {
    kind: "svg",
    markup: clean,
    artboard: { w: artW, h: artH },
    viewBox: hasVB ? vb : null,
    mmPerUnit,
    confidence,
    shapes,
    declared: wAttr && hAttr ? { w: wAttr.n, h: hAttr.n, u: wAttr.u } : null,
  };
}

function analyzePDF(buf) {
  // Page boxes live as plain tokens in the PDF structure, so they can be
  // read directly. Individual cut paths sit inside compressed content
  // streams and are NOT extracted here.
  const bytes = new Uint8Array(buf);
  let s = "";
  const CH = 8192;
  for (let i = 0; i < bytes.length; i += CH) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }

  const grab = (name) => {
    const re = new RegExp("\\/" + name + "\\s*\\[\\s*(-?[\\d.]+)\\s+(-?[\\d.]+)\\s+(-?[\\d.]+)\\s+(-?[\\d.]+)\\s*\\]");
    const m = s.match(re);
    if (!m) return null;
    const [x0, y0, x1, y1] = m.slice(1).map(Number);
    return { w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
  };

  const trim = grab("TrimBox");
  const media = grab("MediaBox");
  const box = trim || media;
  if (!box) throw new Error("مقدرتش أقرا مقاس الصفحة من الـ PDF");

  return {
    kind: "pdf",
    markup: null,
    // PDF user space is points.
    boxMM: { w: toMM(box.w, "pt"), h: toMM(box.h, "pt") },
    usedBox: trim ? "TrimBox" : "MediaBox",
    hasTrim: !!trim,
    confidence: "high",
    shapes: [],
  };
}

function analyzeRaster(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve({
        kind: "raster",
        markup: null,
        px: { w: img.naturalWidth, h: img.naturalHeight },
        confidence: "none",
        shapes: [],
      });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("مقدرتش أفتح الصورة")); };
    img.src = url;
  });
}

async function analyzeDieFile(file) {
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".svg")) {
    return analyzeSVG(await file.text());
  }
  if (name.endsWith(".pdf") || name.endsWith(".ai")) {
    // Modern .ai files carry a PDF-compatible structure, so the same read applies.
    return analyzePDF(await file.arrayBuffer());
  }
  if (/\.(png|jpe?g|webp|gif)$/.test(name)) {
    return analyzeRaster(file);
  }
  throw new Error("صيغة مش مدعومة. استخدم SVG أو PDF أو AI.");
}

function Dieline({ items, face }) {
  const W = 300;
  const H = 640;
  const M = 26;
  const inner = { x: M, y: M, w: W - M * 2, h: H - M * 2 };
  const kColor = {
    logo: "#C8005E", name: "#C8005E", art: "#0091B3",
    badge: "#B87400", volume: "#5C6169",
  };
  const list = items && items.length ? items : [];
  const gap = 7;
  const avail = inner.h - gap * (list.length - 1 || 0);
  const weight = (k) =>
    k === "logo" ? 2.1 : k === "name" ? 1.5 : k === "art" ? 2.4 :
    k === "body" || k === "warning" ? 1.9 : k === "volume" ? 0.7 : 1;
  const total = list.reduce((s, e) => s + weight(e.k), 0) || 1;

  let cursor = inner.y;
  const boxes = list.map((e) => {
    const h = (weight(e.k) / total) * avail;
    const b = { ...e, y: cursor, h };
    cursor += h + gap;
    return b;
  });

  const crop = (x, y, dx, dy) => (
    <g stroke="#16181C" strokeWidth="1">
      <line x1={x} y1={y} x2={x + dx * 13} y2={y} />
      <line x1={x} y1={y} x2={x} y2={y + dy * 13} />
    </g>
  );

  return (
    <svg className="lp-dl" viewBox={`0 0 ${W} ${H}`} role="img"
         aria-label={face === "front" ? "معاينة وش العبوة" : "معاينة ضهر العبوة"}>
      {crop(6, 6, 1, 1)}
      {crop(W - 6, 6, -1, 1)}
      {crop(6, H - 6, 1, -1)}
      {crop(W - 6, H - 6, -1, -1)}

      <rect x={14} y={14} width={W - 28} height={H - 28}
            fill="none" stroke="#C3C7C0" strokeWidth="1" strokeDasharray="4 4" />
      <rect x={inner.x} y={inner.y} width={inner.w} height={inner.h}
            fill="#F7F8F6" stroke="#16181C" strokeWidth="1.5" />

      {boxes.map((b, i) => {
        const c = kColor[b.k] || "#5C6169";
        const isArt = b.k === "art";
        return (
          <g key={i}>
            <rect x={inner.x + 9} y={b.y + 3} width={inner.w - 18} height={Math.max(b.h - 6, 10)}
                  fill={isArt ? "#0091B3" : "none"} fillOpacity={isArt ? 0.07 : 0}
                  stroke={c} strokeWidth="1" strokeDasharray={isArt ? "0" : "3 3"} />
            <text x={W / 2} y={b.y + Math.max(b.h, 12) / 2 + 3.5}
                  textAnchor="middle" fill={c}
                  style={{ font: "500 8.5px 'IBM Plex Mono', monospace" }}>
              {(b.t || "").slice(0, 30)}
            </text>
          </g>
        );
      })}

      <text x={W / 2} y={H - 3} textAnchor="middle" fill="#5C6169"
            style={{ font: "500 8px 'IBM Plex Mono', monospace", letterSpacing: "0.12em" }}>
        {face === "front" ? "TRIM + BLEED" : "TRIM + BLEED"}
      </text>
    </svg>
  );
}

  const zones = c.zones.slice();

  return { ...c, zones };
}

/* Rasterises a DOM node to a high-resolution PNG. The library is fetched
   on first use, so this needs a connection; everything else works offline. */
let H2C = null;
async function loadH2C() {
  if (H2C) return H2C;
  if (window.html2canvas) { H2C = window.html2canvas; return H2C; }
  await new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("مقدرتش أحمّل مكتبة الحفظ — اتأكد من النت"));
    document.head.appendChild(s);
  });
  if (!window.html2canvas) throw new Error("مكتبة الحفظ محمّلتش");
  H2C = window.html2canvas;
  return H2C;
}

async function nodeToPNG(node, scale = 3) {
  const h2c = await loadH2C();
  const canvas = await h2c(node, {
    scale,
    backgroundColor: null,
    useCORS: true,
    logging: false,
  });
  return canvas.toDataURL("image/png");
}

/* Background treatments per style. Each one is a real gradient recipe,

/* Composes a prompt for image tools that accept reference uploads
   (Nano Banana, GPT Image, Flux Kontext). Every asset is numbered so
   the tool places what the user supplies instead of inventing its own. */
/* When the sticker has been exported as an image, the tool stops
   describing the design and hands over the artwork itself. */
function buildWrapPrompt({ face, concept, style, die, container }) {
  const pal = (concept.palette || []).map((p) => p.hex).filter(Boolean);
  const bgSpec = backgroundFor(style, pal);

  const size = die && die.confirmed && die.w > 0 && die.h > 0
    ? `The label measures ${round1(die.w)} x ${round1(die.h)} ${die.unit}, proportion ${ratioText(die.wMM, die.hMM)}. Keep this proportion exactly — do not stretch or squash it.`
    : `Keep the label's original proportion exactly — do not stretch or squash it.`;

  return [
    `IMAGE 1 is a photograph of a real ${container}.`,
    `IMAGE 2 is the finished label artwork.`,
    ``,
    `Apply IMAGE 2 onto the ${container} in IMAGE 1 as a printed wrap-around label.`,
    ``,
    `ARTWORK — keep the design, fix the craft:`,
    `  Keep every element that is in IMAGE 2: the same logo, the same photograph,`,
    `  the same wording, the same colours, and the same top-to-bottom order.`,
    `  Do NOT add any text, logo, barcode, seal, icon or graphic that is not in IMAGE 2.`,
    `  Do NOT remove any element. Do NOT change any wording or spelling.`,
    `  Do NOT introduce colours outside ${pal.join(", ")}.`,
    ``,
    `  You MAY refine the execution so it looks professionally typeset:`,
    `  balance the element sizes so the product name reads as the clear headline`,
    `  and the main image sits as the dominant visual;`,
    `  even out the margins and the vertical spacing between blocks;`,
    `  clean up any ragged or hard-cut edges on the supplied images and blend them`,
    `  smoothly into the label background;`,
    `  align everything to a single consistent centre axis.`,
    ``,
    `  Any area that is blank in IMAGE 2 must stay blank — do not fill it,`,
    `  do not put placeholder words in it, do not draw a box around it.`,
    ``,
    `PLACEMENT:`,
    `  ${size}`,
    `  Wrap it around the curved surface with correct cylindrical perspective, so the`,

/* Image generation runs on Gemini's image model, which accepts reference
   images alongside the instruction. Returns a data URL. */
/* Cheap round-trip to confirm the key actually works before the user
   discovers it silently fell back to the local engine. */
async function verifyGeminiKey(keyInput) {
  const keys = (keyInput || "").split(/[\s,\n]+/).map((x) => x.trim()).filter(Boolean);
  if (!keys.length) throw new Error("no-keys");
  let validCount = 0;
  let firstModel = "";
  let last;
  for (const k of keys) {
    let keyOk = false;
    for (const model of TEXT_MODELS) {
      const url =
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` +
        encodeURIComponent(k);
      let res;
      try {
        res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Reply with the single word: ok" }] }],
            generationConfig: { maxOutputTokens: 5 },
          }),
        });
      } catch (e) {
        throw new Error("blocked: " + (e.message || "fetch failed"));
      }
      if (res.ok) {
        validCount++;
        if (!firstModel) firstModel = model;
        keyOk = true;
        break;
      }
      let detail = "";
      try { detail = (await res.json())?.error?.message || ""; } catch { /* not json */ }
      last = new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
      if (!isRetired(last.message)) break;
    }
  }
  if (validCount > 0) return `${validCount} مفتاح شغال (${firstModel})`;
  throw last;
}

async function askGeminiImageModel(model, promptText, images) {
  const parts = [];
  images.forEach((im) => {
    const m = /^data:([^;]+);base64,(.*)$/.exec(im.dataUrl || "");
    if (!m) return;
    parts.push({ inline_data: { mime_type: m[1], data: m[2] } });
  });
  parts.push({ text: promptText });

  const url =
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` +
    encodeURIComponent(GEMINI_KEY);

  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts }] }),
    });
  } catch (e) {
    throw new Error("blocked: " + (e.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json())?.error?.message || ""; } catch { /* not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  const out = (j?.candidates?.[0]?.content?.parts || [])
    .find((p) => p.inline_data || p.inlineData);
  const blob = out?.inline_data || out?.inlineData;
  if (!blob?.data) {
    const txt = (j?.candidates?.[0]?.content?.parts || []).map((p) => p.text).filter(Boolean).join(" ");
    throw new Error(txt ? "no-image: " + txt.slice(0, 120) : "no-image");
  }
  return `data:${blob.mime_type || blob.mimeType || "image/png"};base64,${blob.data}`;
}

async function askGeminiImage(promptText, images, onWait) {
  if (!GEMINI_KEY) throw new Error("no-key");
  let last;
  for (const m of IMAGE_MODELS) {
    // Image quotas are tight, so a 429 is worth waiting out rather than failing.
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        return await askGeminiImageModel(m, promptText, images);
      } catch (e) {
        last = e;
        const msg = e.message || "";
        if (isRetired(msg)) break;                 // try the next model
        if (!msg.startsWith("http 429")) throw e;  // not a quota problem
        if (attempt === 2) break;
        const secs = 12 * (attempt + 1);
        if (onWait) onWait(secs);
        await new Promise((r) => setTimeout(r, secs * 1000));
      }
    }
  }
  throw last;
}

function hexA(hex, a) {

}

  const boxRef = useRef(null);
  const innerRef = useRef(null);
  const [scale, setScale] = useState(1);

  useLayoutEffect(() => {
    const fit = () => {
      const box = boxRef.current, inner = innerRef.current;
      if (!box || !inner) return;
      const availH = box.clientHeight, needH = inner.scrollHeight;
      if (!availH || !needH) return;
      setScale(needH > availH ? Math.max(availH / needH, 0.4) : 1);
    };
    fit();
    const ro = new ResizeObserver(fit);

    if (innerRef.current) ro.observe(innerRef.current);

function readable(hex) {
  const h = (hex || "#888888").replace("#", "");
  if (h.length !== 6) return "#16181C";
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#16181C" : "#FFFFFF";
}

/* Reads an uploaded artwork file and checks whether it actually
   carries transparency — AI tools often ignore the request for it. */
function readArtImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("مقدرتش أقرا الملف"));
    fr.onload = () => {
      const dataUrl = fr.result;
      const img = new Image();
      img.onerror = () => reject(new Error("مقدرتش أفتح الصورة"));
      img.onload = () => {
        let hasAlpha = false;
        try {
          const S = 90; // sample small — we only need presence of alpha
          const cv = document.createElement("canvas");
          cv.width = S; cv.height = S;
          const ctx = cv.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, S, S);
          const d = ctx.getImageData(0, 0, S, S).data;
          for (let i = 3; i < d.length; i += 4) {
            if (d[i] < 250) { hasAlpha = true; break; }
          }
        } catch { hasAlpha = false; }
        resolve({
          dataUrl,
          name: file.name,
          w: img.naturalWidth,
          h: img.naturalHeight,
          hasAlpha,
        });
      };
      img.src = dataUrl;
    };
    fr.readAsDataURL(file);
  });
}

function BoxPreview({ w, h }) {
  const maxSide = 200;

         role="img" aria-label="نسبة أبعاد الملف">

            fill="#F7F8F6" stroke="#16181C" strokeWidth="1.5" />

  );
}

function ConceptMock({ concept, scope, die, art }) {
  const W = 330;
  // A confirmed die-cut drives the proportion; otherwise fall back to defaults.
  let H = scope === "full" ? 560 : 620;
  if (die && die.confirmed && die.w > 0 && die.h > 0) {
    H = Math.round(Math.min(Math.max((W * die.h) / die.w, 130), 900));
  }
  const pad = 20;
  const pal = (concept.palette || []).map((p) => p.hex).filter(Boolean);
  const bg = pal[0] || "#F2F2F0";
  const accent = pal[1] || "#16181C";
  const accent2 = pal[2] || accent;
  const zones = concept.zones || [];

  const gap = 8;
  const avail = H - pad * 2 - gap * (zones.length - 1 || 0);
  const total = zones.reduce((s, z) => s + (Number(z.h) || 1), 0) || 1;

  let y = pad;
  const boxes = zones.map((z) => {
    const h = ((Number(z.h) || 1) / total) * avail;
    const w = Math.min(Math.max(Number(z.w) || 0.8, 0.25), 1) * (W - pad * 2);
    const x =
      z.align === "start" ? pad :
      z.align === "end" ? W - pad - w :
      pad + (W - pad * 2 - w) / 2;
    const b = { ...z, x, y, w, h };
    y += h + gap;
    return b;
  });

  const fillFor = (t) =>
    t === "accent" ? accent : t === "dark" ? accent2 : "#FFFFFF";
  const opacityFor = (t) => (t === "light" ? 0.55 : 0.92);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", maxWidth: 340, border: "1px solid #C3C7C0" }}
         role="img" aria-label="تصور بصري مبدئي للملصق">
      <rect x="0" y="0" width={W} height={H} fill={bg} />
      {boxes.map((b, i) => {
        const isArt = b.role === "art";
        const shot = isArt && art ? art[artKey(b.label)] : null;
        const f = fillFor(b.tone);
        const txt = readable(b.tone === "light" ? bg : f);

        if (shot) {
          // Contain, never crop or stretch — this is a reference, not a crop tool.
          return (
            <g key={i}>
              <image href={shot.dataUrl} x={b.x} y={b.y}
                     width={b.w} height={Math.max(b.h, 9)}
                     preserveAspectRatio="xMidYMid meet" />
            </g>
          );
        }

        return (
          <g key={i}>
            <rect x={b.x} y={b.y} width={b.w} height={Math.max(b.h, 9)}
                  fill={f} fillOpacity={opacityFor(b.tone)}
                  stroke={isArt ? accent : "none"} strokeWidth={isArt ? 1 : 0}
                  strokeDasharray={isArt ? "4 3" : "0"} />
            <text x={b.x + b.w / 2} y={b.y + Math.max(b.h, 12) / 2 + 3.5}
                  textAnchor="middle" fill={txt}
                  style={{
                    font: `${b.role === "name" || b.role === "brand" ? 700 : 500} ${
                      b.role === "name" ? 12 : b.role === "brand" ? 10.5 : 8.5
                    }px 'IBM Plex Sans Condensed', sans-serif`,
                    letterSpacing: b.role === "brand" ? "0.1em" : "0",
                  }}>
              {(b.label || "").slice(0, 26)}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function LabelPrepTool() {
  const [desc, setDesc] = useState("");
  const [data, setData] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [stage, setStage] = useState("");
  // Die-cut step
  const [dieFile, setDieFile] = useState(null);
  const [dieRaw, setDieRaw] = useState(null);     // analysis result
  const [dieShape, setDieShape] = useState(0);    // chosen shape index
  const [dieErr, setDieErr] = useState("");
  const [dieBusy, setDieBusy] = useState(false);
  const [dieW, setDieW] = useState("");
  const [dieH, setDieH] = useState("");
  const [dieUnit, setDieUnit] = useState("mm");
  const [die, setDie] = useState(null);           // confirmed reference

  const resetDie = () => {
    setDieFile(null); setDieRaw(null); setDieShape(0);
    setDieErr(""); setDieW(""); setDieH(""); setDieUnit("mm"); setDie(null);
  };

  // Fill the editable fields from whatever the file actually yielded.
  const applyMeasured = (res, shapeIdx) => {
    if (res.kind === "svg") {
      const sh = res.shapes[shapeIdx];
      if (sh && res.mmPerUnit) {
        setDieUnit("mm");
        setDieW(String(round1(sh.w * res.mmPerUnit)));
        setDieH(String(round1(sh.h * res.mmPerUnit)));
      } else if (sh) {
        setDieUnit("px");
        setDieW(String(round1(sh.w)));
        setDieH(String(round1(sh.h)));
      }
    } else if (res.kind === "pdf") {
      setDieUnit("mm");
      setDieW(String(round1(res.boxMM.w)));
      setDieH(String(round1(res.boxMM.h)));
    } else if (res.kind === "raster") {
      setDieUnit("px");
      setDieW(String(res.px.w));
      setDieH(String(res.px.h));
    }
  };

  const onDieFile = async (file) => {
    if (!file) return;
    setDieBusy(true); setDieErr(""); setDie(null); setDieRaw(null);
    try {
      const res = await analyzeDieFile(file);
      setDieFile({ name: file.name, size: file.size });
      setDieRaw(res);
      setDieShape(0);
      applyMeasured(res, 0);
    } catch (e) {
      setDieErr(e.message || "مقدرتش أحلل الملف");
      setDieFile({ name: file.name, size: file.size });
    } finally {
      setDieBusy(false);
    }
  };

  const pickShape = (idx) => {
    setDieShape(idx);
    if (dieRaw) applyMeasured(dieRaw, idx);
  };

  const confirmDie = () => {
    const w = parseFloat(dieW);
    const h = parseFloat(dieH);
    if (!(w > 0) || !(h > 0)) { setDieErr("اكتب عرض وارتفاع صالحين"); return; }
    setDieErr("");
    setDie({
      confirmed: true,
      w, h, unit: dieUnit,
      wMM: toMM(w, dieUnit),
      hMM: toMM(h, dieUnit),
      source: dieRaw?.kind || "manual",
      file: dieFile?.name || "",
    });
  };

  // Uploaded artwork, keyed by zone label. Session only.
  const [art, setArt] = useState({});
  const [artErr, setArtErr] = useState("");

  const onArtFile = async (label, file) => {
    if (!file) return;
    setArtErr("");
    try {
      const img = await readArtImage(file);
      setArt((prev) => ({ ...prev, [artKey(label)]: img }));
    } catch (e) {
      setArtErr(e.message || "مقدرتش أحمّل الصورة");
    }
  };

  const clearArt = (label) => {
    setArt((prev) => {
      const next = { ...prev };
      delete next[artKey(label)];
      return next;
    });
  };

  const [logo, setLogo] = useState(null);
  const [extras, setExtras] = useState({});

  // One entry point for every slot on the final mockup.
  const pickSlot = async (which, file) => {
    if (!file) return;
    setArtErr("");
    try {
      const img = await readArtImage(file);
      if (which === "logo") setLogo(img);
      else if (which.startsWith("extra:")) {
        const k = which.slice(6);
        setExtras((p) => ({ ...p, [k]: img }));
      } else {
        setArt((p) => ({ ...p, [artKey(which)]: img }));
      }
    } catch (e) {
      setArtErr(e.message || "مقدرتش أحمّل الصورة");
    }
  };

  const clearSlot = (which) => {
    if (which === "logo") setLogo(null);
    else if (which.startsWith("extra:")) {
      const k = which.slice(6);
      setExtras((p) => { const n = { ...p }; delete n[k]; return n; });
    } else clearArt(which);
  };

  // Every generated prompt gets its own slot, so two back prompts
  // produce two upload spots rather than one.
  const slotsFor = (face) => {
    const fromPrompts = (data?.prompts || [])
      .filter((p) => (p.face || "front") === face)
      .map((p) => ({ key: p.title, title: p.title, hint: p.place || "" }));
    if (fromPrompts.length) return fromPrompts;
    // Fall back to any artwork element in the split.
    return (face === "front" ? data?.front : data?.back || [])
      .filter((e) => e.k === "art")
      .map((e) => ({ key: e.t, title: e.t, hint: e.n || "" }));
  };

  // Real product photos + the composited results.
  const [shotFront, setShotFront] = useState(null);
  const [shotBack, setShotBack] = useState(null);
  const [applied, setApplied] = useState({});
  const [applyBusy, setApplyBusy] = useState("");
  const [applyErr, setApplyErr] = useState("");

  const pickShot = async (face, file) => {
    if (!file) return;
    setApplyErr("");
    try {
      const img = await readArtImage(file);
      (face === "front" ? setShotFront : setShotBack)(img);
    } catch (e) {
      setApplyErr(e.message || "مقدرتش أحمّل الصورة");
    }
  };

  const applyToProduct = async (face) => {
    const shot = face === "front" ? shotFront : shotBack;
    if (!shot) return;
    setApplyBusy(face); setApplyErr("");
    try {
      const s = slotsFor(face);
      const refs = [shot];
      let prompt;

      if (sticker[face]) {
        // The finished artwork exists as an image, so hand that over directly.
        refs.push({ dataUrl: sticker[face] });
        prompt = buildWrapPrompt({ face, concept, style, die, container: "spray bottle" });
      } else {
        if (logo) refs.push(logo);
        s.forEach((x) => { const a = art[artKey(x.key)]; if (a) refs.push(a); });
        prompt = buildApplyPrompt({
          face, data, concept, style, die, slots: s,
          hasLogo: !!logo, nRefs: refs.length,
        });
      }
      const url = await askGeminiImage(prompt, refs, (secs) =>
        setApplyBusy(`wait:${secs}`)
      );
      setApplied((p) => ({ ...p, [face]: url }));
    } catch (e) {
      const m = e.message || "";
      setApplyErr(
        m === "no-key" ? "محتاج مفتاح Gemini في أول الصفحة عشان الخطوة دي تشتغل."
        : m.startsWith("no-image") ? "جيميني رجّع نص مش صورة. جرّب تاني أو غيّر صورة المنتج."
        : m.startsWith("http 429") ? "خلصت حصة توليد الصور. الحصة المجانية صغيرة جدًا — استنى شوية وجرّب، أو فعّل الفوترة في Google Cloud. في الوقت ده انسخ برومبت الوجه فوق واستخدمه في أي أداة صور تانية."
        : m.startsWith("http 403") ? "جوجل رفضت الطلب: " + m.replace(/^http 403:?\s*/, "")
        : m.startsWith("blocked") ? "النداء اتحجب من الصفحة دي. شغّل الملف على جهازك."
        : "حصلت مشكلة: " + m
      );
    } finally {
      setApplyBusy("");
    }
  };

  // Exported sticker PNGs, keyed by face.
  const faceNodes = useRef({});
  const [sticker, setSticker] = useState({});
  const [saveBusy, setSaveBusy] = useState("");
  const [saveErr, setSaveErr] = useState("");

  const registerNode = (face, el) => { faceNodes.current[face] = el; };

  const saveSticker = async (face) => {
    const node = faceNodes.current[face];
    if (!node) return;
    setSaveBusy(face); setSaveErr("");
    node.classList.add("lp-export");
    try {
      // Let the browser paint the export styles before capturing.
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const url = await nodeToPNG(node, 3);
      setSticker((p) => ({ ...p, [face]: url }));
      const a = document.createElement("a");
      a.href = url;
      a.download = `sticker-${face}.png`;
      a.click();
    } catch (e) {
      setSaveErr(e.message || "مقدرتش أحفظ الصورة");
    } finally {
      node.classList.remove("lp-export");
      setSaveBusy("");
    }
  };

  const [localMode, setLocalMode] = useState(false);
  const [apiKey, setApiKey] = useState("");
  const [showKey, setShowKey] = useState(false);
  const [keyState, setKeyState] = useState("");   // "" | checking | ok | bad
  const [keyMsg, setKeyMsg] = useState("");
  const keyTimer = useRef(null);

  const onKeyChange = (v) => {
    setApiKey(v);
    setGeminiKey(v);
    setKeyState(""); setKeyMsg("");
    if (keyTimer.current) clearTimeout(keyTimer.current);
    const k = v.trim();
    if (!k) return;
    // Wait for typing to settle before spending a call.
    keyTimer.current = setTimeout(async () => {
      setKeyState("checking");
      try {
        const model = await verifyGeminiKey(k);
        setKeyState("ok"); setKeyMsg(model);
      } catch (e) {
        const m = e.message || "";
        setKeyState("bad");
        setKeyMsg(
          m.startsWith("blocked") ? "النداء اتحجب من الصفحة دي — المفتاح غالبًا سليم. نزّل ملف الـ HTML وشغّله على جهازك."
          : isRetired(m) ? "أسماء الموديلات اتغيرت عند جوجل. قولي وهحدّثها."
          : m.startsWith("http 400") ? "المفتاح مش مقبول — " + m.replace(/^http 400:?\s*/, "")
          : m.startsWith("http 403") ? "جوجل رفضت المفتاح. الرسالة منها: " + m.replace(/^http 403:?\s*/, "")
          : m.startsWith("http 429") ? "المفتاح شغال بس الطلبات كتير دلوقتي"
          : m.startsWith("http 5") ? "السيرفر مش راد — جرّب تاني"
          : "مقدرتش أوصل للسيرفر: " + m
        );
      }
    }, 700);
  };
  const [tab, setTab] = useState("split");
  const [copied, setCopied] = useState("");

  // Feature 1 — Visual AI Director
  const [director, setDirector] = useState(null);
  const [dirBusy, setDirBusy] = useState(false);
  const [dirErr, setDirErr] = useState("");
  const [oneBusy, setOneBusy] = useState(-1);

  // Feature 2 — Label Concept Generator
  const [brand, setBrand] = useState("");
  const [style, setStyle] = useState(STYLES[0]);
  const [scope, setScope] = useState("front");
  const [concept, setConcept] = useState(null);
  const [conBusy, setConBusy] = useState(false);
  const [conErr, setConErr] = useState("");

  const [newIdeaText, setNewIdeaText] = useState("");
  const [promptsBusy, setPromptsBusy] = useState(false);
  const [promptsErr, setPromptsErr] = useState("");

  const regenPrompts = async () => {
    if (!data) return;
    setPromptsBusy(true); setPromptsErr("");
    try {
      const r = await askClaudeRetry(SYS_PROMPTS, desc.trim());
      if ((r.prompts || []).length) {
        setData((d) => ({ ...d, prompts: r.prompts }));
      } else throw new Error("empty");
    } catch {
      setPromptsErr("مقدرتش أعيد التوليد. جرّب تاني.");
    } finally {
      setPromptsBusy(false);
    }
  };

  const runNewIdea = async () => {
    if (!data || !newIdeaText.trim()) return;
    setPromptsBusy(true); setPromptsErr("");
    try {
      const SYS_NEW_IDEA = SYS_PROMPTS + `\n\nThe user wants a NEW creative direction: "${newIdeaText.trim()}". Generate 4 fully new, coherent prompts matching this direction.`;
      const r = await askClaudeRetry(SYS_NEW_IDEA, desc.trim());
      if ((r.prompts || []).length) {
        setData((d) => ({ ...d, prompts: r.prompts }));
      } else throw new Error("empty");
    } catch {
      setPromptsErr("مقدرتش أولّد الفكرة الجديدة. جرّب تاني.");
    } finally {
      setPromptsBusy(false);
    }
  };

  const run = async () => {
    const input = desc.trim();
    if (!input) return;
    setBusy(true); setErr(""); setData(null);

    let split, prompts, usedLocal = false;

    // Both calls are independent, so they run together rather than in sequence.
    setStage("بيقسّم العناصر ويكتب البرومبتات…");
    const [splitRes, promptRes] = await Promise.allSettled([
      askClaudeRetry(SYS_SPLIT, input),
      askClaudeRetry(SYS_PROMPTS, input),
    ]);

    if (splitRes.status === "fulfilled") {
      split = splitRes.value;
    } else {
      split = localSplit(input);
      usedLocal = true;
    }

    if (promptRes.status === "fulfilled" && (promptRes.value.prompts || []).length) {
      prompts = promptRes.value.prompts;
    } else {
      prompts = localPrompts(input).prompts;
      usedLocal = true;
    }

    setData({ ...split, prompts });
    setLocalMode(usedLocal);
    setDirector(null); setDirErr("");
    setConcept(null); setConErr("");
    setTab("split");
    setBusy(false);
    setStage("");
  };

  const copy = async (text, key) => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(key);
      setTimeout(() => setCopied(""), 1600);
    } catch { /* clipboard unavailable */ }
  };

  // --- Feature 1 handlers ---
  const productBrief = () => {
    const p = data?.product?.en ? `Product: ${data.product.en}\n` : "";
    return `${p}${desc.trim()}`;
  };

  const runDirector = async () => {
    setDirBusy(true); setDirErr("");
    try {
      const r = await askClaudeRetry(SYS_DIRECTOR, productBrief());
      const items = r.items || [];
      setDirector(items.length ? items : localDirector(desc).items);
      if (!items.length) setLocalMode(true);
    } catch {
      setDirector(localDirector(desc).items);
      setLocalMode(true);
    } finally {
      setDirBusy(false);
    }
  };

  const regenOne = async (i) => {
    const cur = director[i];
    setOneBusy(i);
    try {
      const r = await askClaudeRetry(
        SYS_DIRECTOR_ONE,
        `${productBrief()}\n\nCurrent proposal to replace:\n${JSON.stringify(cur)}`
      );
      if (r.item) {
        const next = director.slice();
        next[i] = r.item;
        setDirector(next);
      }
    } catch { /* keep the existing item */ }
    finally { setOneBusy(-1); }
  };

  // --- Feature 2 handlers ---
  const runConcept = async () => {
    setConBusy(true); setConErr("");
    const scopeLabel = SCOPES.find((s) => s.id === scope)?.label || "Front Label Concept";
    const ing = (data?.back || [])
      .filter((e) => e.k === "ingredients")
      .map((e) => e.t).join(", ");
    const assets = (director || []).map((d) => d.name).join(", ");
    const brief = [
      productBrief(),
      brand ? `Brand name: ${brand}` : "",
      ing ? `Key ingredients: ${ing}` : "",
      assets ? `Proposed visual assets: ${assets}` : "",
      `Design style: ${style}`,
      `Scope: ${scopeLabel}`,
      die && die.confirmed
        ? `Label proportion: ${round1(die.w)} x ${round1(die.h)} ${die.unit} (aspect ${ratioText(die.wMM, die.hMM)}). Lay the hierarchy out to suit this proportion.`
        : "",
      concept ? "Give a DIFFERENT visual direction from the previous one." : "",
    ].filter(Boolean).join("\n");
    try {
      const r = await askClaudeRetry(SYS_CONCEPT, brief);
      if (!r || !(r.zones || []).length) throw new Error("empty");
      setConcept(ensureArtZone(r));
    } catch {
      setConcept(ensureArtZone(localConcept(desc, style, scope, brand)));
      setLocalMode(true);
    } finally {
      setConBusy(false);
    }
  };

  const sample = `Melano Massage Spray — topical massage spray with soothing oils and Menthol. Cooling and warming dual action, for joints and muscles pain. Ingredients: Eucalyptus Oil, Turpentine Oil, Methyl Salicylate, Menthol Crystals.`;

  const Face = ({ title, items }) => (
    <div className="lp-face">
      <div className="lp-facehead">
        <span>{title}</span>
        <span>{items.length} EL</span>
      </div>
      {items.map((e, i) => (
        <div className="lp-el" key={i}>
          <div className="lp-elnum">{String(i + 1).padStart(2, "0")}</div>
          <div className="lp-elbody">
            <div className="lp-elen">{e.t}</div>
            {e.ar ? <div className="lp-elar">{e.ar}</div> : null}
            {e.n ? <div className="lp-elnote">{e.n}</div> : null}
          </div>
          <span className="lp-tag">{e.k}</span>
        </div>
      ))}
    </div>
  );

  return (
    <div className="lp-root">
      <style>{CSS}</style>
      <div className="lp-shell">

        <header className="lp-head">
          <div>
            <h1 className="lp-title">تجهيز عناصر الاستيكر</h1>
            <p className="lp-sub">
              الصق وصف المنتج، وهتطلع بتقسيم العناصر لوش وضهر، برومبتات جاهزة
              لأداة توليد الصور، ومعاينة مبدئية لشكل الملصق قبل ما المصمم يبدأ.
            </p>
          </div>
          <div className="lp-stamp">LABEL PREP / v1</div>
        </header>

        <div className="lp-inputwrap">
          <label className="lp-label" htmlFor="apikey">
            مفتاح Gemini (اختياري)
          </label>
          <p className="lp-hint">
            من غير مفتاح الأداة شغالة بالمحرّك المحلي. مع المفتاح الصياغة بتبقى أذكى.
            <b>يمكنك وضع أكثر من مفتاح وتفصل بينهم بفارزة (,)</b> للتبديل التلقائي بينهم فوراً لو أحد المفاتيح خلصت حصته!
            <br />
            <b>مهم:</b> لو كل المفاتيح تعطلت، الأداة بتكمل تلقائياً بالمحرك المجاني لضمان عدم توقف العمل وتوليد البرومبتات دائماً.
          </p>
          <div className="lp-row" style={{ marginTop: 0 }}>
            <input
              id="apikey"
              className="lp-ta"
              type={showKey ? "text" : "password"}
              style={{ minHeight: 0, height: 42, flex: "1 1 240px", direction: "ltr", textAlign: "left" }}
              value={apiKey}
              onChange={(e) => onKeyChange(e.target.value)}
              placeholder="AIza…"
              autoComplete="off"
              spellCheck="false"
            />
            <button className="lp-btn lp-btn-ghost" onClick={() => setShowKey((v) => !v)}>
              {showKey ? "إخفاء" : "إظهار"}
            </button>
            {keyState === "checking" ? <span className="lp-keychk">بيتأكد…</span> : null}
            {keyState === "ok" ? (
              <span className="lp-keyok">
                اشتغل يا حوده ✓
                {keyMsg ? <em className="lp-keymodel">{keyMsg}</em> : null}
              </span>
            ) : null}
            {keyState === "bad" ? <span className="lp-keybad">{keyMsg}</span> : null}
          </div>
        </div>

        <div className="lp-inputwrap">
          <label className="lp-label" htmlFor="desc">وصف المنتج</label>
          <p className="lp-hint">
            اكتب الاسم، الاستخدام، المكونات، وأي ادعاءات على العبوة. عربي أو إنجليزي أو الاتنين.
          </p>
          <textarea
            id="desc"
            className="lp-ta"
            value={desc}
            onChange={(e) => setDesc(e.target.value)}
            placeholder="مثال: سبراي مساج موضعي بزيوت مهدئة ومنثول، لألم المفاصل والعضلات، بمفعول تبريد وتدفئة…"
          />
          <div className="lp-row">
            <button className="lp-btn" onClick={run} disabled={busy || !desc.trim()}>
              {busy ? (stage || "بيجهّز…") : "جهّز العناصر"}
            </button>
            <button className="lp-btn lp-btn-ghost" onClick={() => setDesc(sample)} disabled={busy}>
              جرّب بمثال
            </button>
          </div>
          {err ? <div className="lp-err">{err}</div> : null}
        </div>

        {data && localMode ? (
          <p className="lp-eyebrow" style={{ marginTop: -2, marginBottom: 18 }}>
            اتولّد محليًا — <b>من غير AI</b>
          </p>
        ) : null}

        {data ? (
          <>
            <div className="lp-tabs" role="tablist">
              <button className="lp-tab" data-on={tab === "split" ? 1 : 0}
                      onClick={() => setTab("split")} role="tab" aria-selected={tab === "split"}>
                تقسيم العناصر
                <span>{(data.front?.length || 0) + (data.back?.length || 0)}</span>
              </button>
              <button className="lp-tab" data-on={tab === "prompts" ? 1 : 0}
                      onClick={() => setTab("prompts")} role="tab" aria-selected={tab === "prompts"}>
                برومبتات الرسومات
                <span>{data.prompts?.length || 0}</span>
              </button>
              <button className="lp-tab" data-on={tab === "dieline" ? 1 : 0}
                      onClick={() => setTab("dieline")} role="tab" aria-selected={tab === "dieline"}>
                معاينة الملصق
              </button>
              <button className="lp-tab" data-on={tab === "director" ? 1 : 0}
                      onClick={() => setTab("director")} role="tab" aria-selected={tab === "director"}>
                Visual AI Director
                {director ? <span>{director.length}</span> : null}
              </button>
              <button className="lp-tab" data-on={tab === "diecut" ? 1 : 0}
                      onClick={() => setTab("diecut")} role="tab" aria-selected={tab === "diecut"}>
                Die-Cut
                {die ? <span>✓</span> : null}
              </button>
              <button className="lp-tab" data-on={tab === "concept" ? 1 : 0}
                      onClick={() => setTab("concept")} role="tab" aria-selected={tab === "concept"}>
                Label Concept
              </button>
              <button className="lp-tab" data-on={tab === "final" ? 1 : 0}
                      onClick={() => setTab("final")} role="tab" aria-selected={tab === "final"}>
                التصميم النهائي
              </button>
            </div>

            {tab === "split" ? (
              <>
                <p className="lp-eyebrow">
                  المنتج <b>{data.product?.en || "—"}</b>
                </p>
                <div className="lp-facegrid">
                  <Face title="FRONT / الوش" items={data.front || []} />
                  <Face title="BACK / الضهر" items={data.back || []} />
                </div>
                <p className="lp-note">
                  كل سطر هنا عنصر مستقل. المصمم بيحوّل كل واحد لملف TIFF بخلفية شفافة
                  على 300 DPI، وبيرصّهم في الإليستريتور حسب المعاينة.
                </p>
              </>
            ) : null}

            {tab === "prompts" ? (
              <>
                <p className="lp-eyebrow">
                  انسخ البرومبت زي ما هو في أداة توليد الصور
                </p>

                {/* ── New Idea panel ─────────────────────────────── */}
                <div className="lp-inputwrap" style={{ marginBottom: 18 }}>
                  <label className="lp-label">فكرة جديدة — عشان تغيّر كل البرومبتات مع بعض</label>
                  <p className="lp-hint">
                    لو عايز اتجاه مختلف تمامًا، اكتب هنا وصف الفكرة الجديدة (زي: «فكرة مينيمال بألوان محايدة» أو «رسومات طبيعية بمكونات نباتية»).
                    البرومبتات كلها هتتغير مع بعض عشان تفضل متناسقة.
                  </p>
                  <textarea
                    className="lp-ta"
                    style={{ minHeight: 72 }}
                    value={newIdeaText}
                    onChange={(e) => setNewIdeaText(e.target.value)}
                    placeholder="مثال: فكرة بصرية دافية وعضوية تركّز على مكوّن الكافور، خلفية كريمية، خطوط ناعمة..."
                  />
                  <div className="lp-row" style={{ marginTop: 10 }}>
                    <button className="lp-btn" onClick={runNewIdea} disabled={promptsBusy || !newIdeaText.trim()}>
                      {promptsBusy ? "بيعيد التوليد…" : "ولّد فكرة جديدة"}
                    </button>
                    {promptsBusy ? null : (
                      <button className="lp-btn lp-btn-ghost" onClick={regenPrompts} disabled={promptsBusy}>
                        أعد توليد البرومبتات الحالية
                      </button>
                    )}
                  </div>
                  {promptsErr ? <div className="lp-err" style={{ marginTop: 8 }}>{promptsErr}</div> : null}
                </div>

                {!(data.prompts || []).length ? (
                  <div className="lp-err">
                    البرومبتات مجتش المرة دي. اضغط «جهّز العناصر» تاني — التقسيم هيفضل زي ما هو.
                  </div>
                ) : null}
                {(data.prompts || []).map((p, i) => (
                  <div className="lp-prompt" key={i}>
                    <div className="lp-phead">
                      <h3 className="lp-ptitle">{p.title}</h3>
                      <button className="lp-btn lp-btn-ghost" onClick={() => copy(p.p, "pr" + i)}>
                        {copied === "pr" + i ? "اتنسخ" : "Copy Prompt"}
                      </button>
                    </div>
                    <p className="lp-pplace">
                      <strong>{p.face === "front" ? "الوش" : "الضهر"}</strong> — {p.place}
                    </p>
                    <div className="lp-ptext">{p.p}</div>
                  </div>
                ))}
                <p className="lp-note">
                  لو الأداة مش بتطلع خلفية شفافة، غيّر آخر البرومبت لـ pure white background
                  وشيلها بعدين من الإليستريتور.
                </p>
              </>
            ) : null}

            {tab === "dieline" ? (
              <>
                <p className="lp-eyebrow">

                                <img src={shot.dataUrl} alt={label} />
                              ) : (
                                <label className="lp-slotempty" htmlFor={`shot-${face}`}
                                       style={{ minHeight: 120 }}>
                                  <b>ارفع صورة العبوة</b>
                                  <span>خلفية بسيطة وإضاءة واضحة</span>
                                </label>
                              )}
                              <input id={`shot-${face}`} type="file" style={{ display: "none" }}
                                     accept="image/png,image/webp,image/jpeg"
                                     onChange={(e) => pickShot(face, e.target.files?.[0])} />
                            </div>

                            <div className="lp-row">
                              <button className="lp-btn" onClick={() => applyToProduct(face)}
                                      disabled={!shot || applyBusy === face || applyBusy.startsWith("wait:")}>
                                {applyBusy.startsWith("wait:")
                                  ? `الحصة خلصت — بيستنى ${applyBusy.slice(5)} ثانية…`
                                  : applyBusy === face ? "بيركّب…" : "ركّب الاستيكر"}
                              </button>
                              {shot ? (
                                <label className="lp-btn lp-btn-ghost" htmlFor={`shot-${face}`}
                                       style={{ cursor: "pointer" }}>غيّر الصورة</label>
                              ) : null}
                            </div>

                            {applied[face] ? (
                              <div className="lp-mockout">
                                <img src={applied[face]} alt={`النتيجة — ${label}`} />
                                <a className="lp-btn lp-btn-ghost" href={applied[face]}
                                   download={`mockup-${face}.png`}>نزّل الصورة</a>
                              </div>
                            ) : null}
                          </div>
                        ))}
                      </div>

                      {applyErr ? <div className="lp-err" style={{ marginTop: 12 }}>{applyErr}</div> : null}

                      {!GEMINI_KEY ? (
                        <div className="lp-banner" style={{ marginTop: 12 }}>
                          <strong>الخطوة دي محتاجة مفتاح Gemini.</strong>{" "}
                          حطه في الخانة أول الصفحة. من غيره باقي الأداة شغالة عادي.
                        </div>
                      ) : null}
                    </div>

                    <div className="lp-dir" style={{ marginTop: 26 }}>
                      <p className="lp-eyebrow">تحليل القرارات البصرية</p>
                      {buildRationale(concept, style, die, desc).map((d, i) => (
                        <div key={i}>
                          <p className="lp-dirq">{d.q}</p>
                          <p className="lp-dira">{d.a}</p>
                        </div>
                      ))}
                    </div>

                    {(concept.direction || []).length ? (
                      <div className="lp-dir" style={{ marginTop: 18 }}>
                        <p className="lp-eyebrow">ترتيب المعلومات</p>
                        {(concept.direction || []).map((d, i) => (
                          <div key={i}>
                            <p className="lp-dirq">{d.q}</p>
                            <p className="lp-dira">{d.a}</p>
                          </div>
                        ))}
                      </div>
                    ) : null}

                    <p className="lp-note">
                      الصور بتفضل في الجلسة دي بس. لو قفلت الصفحة هتحتاج ترفعها تاني.
                    </p>
                  </>
                )}
              </>
            ) : null}
          </>
        ) : null}

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<LabelPrepTool />);
</script>
</body>
</html>
