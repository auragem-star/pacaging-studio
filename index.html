<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تجهيز عناصر الاستيكر — Label Prep</title>
<style>
  html, body { margin:0; padding:0; background:#E8EAF2; }
  #boot { font-family: system-ui, sans-serif; padding:40px; text-align:center; color:#5C6169; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
<div id="root"><div id="boot">بيحمّل…</div></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useLayoutEffect } = React;

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap');

.lp-root, .lp-root * { box-sizing: border-box; }
.lp-root {
  --paper: #E8EAF2;
  --panel: #FFFFFF;
  --ink: #14161C;
  --ink-soft: #5A6070;
  --rule: #C9CEDC;
  --cyan: #0091B3;
  --magenta: #C8005E;
  --amber: #B87400;

  position: relative;
  background: var(--paper);
  background-image:
    radial-gradient(46% 34% at 8% 2%, rgba(0,145,179,0.22) 0%, rgba(0,145,179,0) 62%),
    radial-gradient(38% 30% at 96% 10%, rgba(200,0,94,0.16) 0%, rgba(200,0,94,0) 64%),
    radial-gradient(52% 38% at 88% 78%, rgba(184,116,0,0.14) 0%, rgba(184,116,0,0) 66%),
    radial-gradient(44% 32% at 4% 92%, rgba(0,145,179,0.14) 0%, rgba(0,145,179,0) 66%),
    linear-gradient(165deg, #F3F5FA 0%, #E8EAF2 55%, #DFE3EE 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  min-height: 100vh;
  padding: 28px 20px 80px;
  direction: rtl;
  overflow-x: hidden;
}
/* soft geometry behind the content */
.lp-root::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    repeating-linear-gradient(58deg, rgba(20,22,28,0.035) 0 1px, transparent 1px 62px);
}
.lp-shell { position: relative; z-index: 1; }

.lp-shell { max-width: 1180px; margin: 0 auto; width: 100%; }
.lp-el { min-width: 0; }
.lp-elbody { overflow-wrap: anywhere; }

/* ---------- masthead ---------- */
.lp-head {
  border-bottom: 2px solid var(--ink);
  padding-bottom: 14px;
  margin-bottom: 26px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.lp-head > div { min-width: 0; flex: 1 1 260px; }
.lp-title {
  font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans Arabic', sans-serif;
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin: 0;
}
.lp-sub { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 0; max-width: 46ch; line-height: 1.6; }
.lp-stamp {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  padding: 5px 9px;
  white-space: nowrap;
  direction: ltr;
}

/* ---------- eyebrow ---------- */
.lp-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
}
.lp-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.lp-eyebrow b { color: var(--magenta); font-weight: 600; }

/* ---------- input ---------- */
.lp-inputwrap { background: var(--panel); border: 1px solid var(--rule); padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(20,22,28,0.05); }
.lp-spwrap { border-color: var(--ink); }
.lp-ideatag {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft);
  border: 1px solid var(--rule); padding: 6px 10px; white-space: nowrap;
}
.lp-chip { display: inline-flex; align-items: center; gap: 8px; }
.lp-chipdots { display: inline-flex; gap: 2px; flex-shrink: 0; }
.lp-chipdots i {
  display: block; width: 9px; height: 14px;
  border: 1px solid rgba(20,22,28,0.18);
}
.lp-chip[data-on="1"] .lp-chipdots i { border-color: rgba(255,255,255,0.35); }
.lp-faceblock { border-top: 1px solid var(--rule); padding-top: 14px; margin-top: 18px; }
.lp-plabel {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft);
}
.lp-extract { margin-top: 12px; border: 1px solid var(--rule); background: #FAFBFD; }
.lp-extract summary {
  cursor: pointer; padding: 10px 12px; font-size: 12.5px; font-weight: 600;
  list-style: none; user-select: none; display: flex; align-items: center; gap: 8px;
}
.lp-extract summary::-webkit-details-marker { display: none; }
.lp-extract summary::before { content: "▸"; color: var(--ink-soft); }
.lp-extract[open] summary::before { content: "▾"; }
.lp-extract summary b {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500;
  color: var(--paper); background: var(--ink); padding: 1px 6px;
}
.lp-exrow { padding: 0 12px 12px; }
.lp-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; }
.lp-hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.6; }
.lp-ta {
  width: 100%;
  min-height: 190px;
  resize: vertical;
  background: #fff;
  border: 1px solid var(--rule);
  padding: 12px;
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--ink);
  box-sizing: border-box;
}
.lp-ta:focus { outline: 2px solid var(--cyan); outline-offset: -1px; }

.lp-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.lp-btn {
  background: var(--ink); color: var(--paper); border: none;
  padding: 11px 22px; font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.lp-btn:hover:not(:disabled) { background: var(--magenta); }
.lp-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.lp-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.lp-btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); font-weight: 500; padding: 10px 16px; }
.lp-btn-ghost:hover:not(:disabled) { background: #fff; border-color: var(--ink); color: var(--ink); }

.lp-err { border-right: 3px solid var(--magenta); background: #fff; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-top: 12px; }

.lp-keychk, .lp-keyok, .lp-keybad { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.lp-keychk { color: var(--ink-soft); }
.lp-keyok { color: #1E7A3C; }
.lp-keybad { color: var(--magenta); white-space: normal; }
.lp-keymodel {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-style: normal;
  font-weight: 400; color: var(--ink-soft); margin-inline-start: 7px; direction: ltr;
}

/* ---------- tabs ---------- */
.lp-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin: 30px 0 20px; flex-wrap: wrap; }
.lp-tab {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  padding: 11px 16px; cursor: pointer; font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 13.5px; font-weight: 500; color: var(--ink-soft);
}
.lp-tab:hover { color: var(--ink); }
.lp-tab[data-on="1"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--magenta); }
.lp-tab span { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); margin-inline-start: 6px; }

/* ---------- element list ---------- */
.lp-facegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }
.lp-face { background: var(--panel); border: 1px solid var(--rule); }
.lp-facehead {
  padding: 10px 14px; border-bottom: 1px solid var(--rule);
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; display: flex; justify-content: space-between;
}
.lp-el { padding: 12px 14px; border-bottom: 1px solid var(--rule); display: flex; gap: 12px; }
.lp-el:last-child { border-bottom: none; }
.lp-elnum { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--cyan); padding-top: 3px; min-width: 22px; }
.lp-elbody { flex: 1; min-width: 0; }
.lp-elen { font-size: 13.5px; font-weight: 600; direction: ltr; text-align: left; word-break: break-word; }
.lp-elar { font-size: 13.5px; margin-top: 3px; }
.lp-elnote { font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; line-height: 1.55; }
.lp-tag {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; border: 1px solid var(--rule); padding: 2px 5px; align-self: flex-start; color: var(--ink-soft);
}

/* ---------- prompts ---------- */
.lp-prompt { background: var(--panel); border: 1px solid var(--rule); padding: 16px; margin-bottom: 12px; }
.lp-phead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.lp-ptitle { font-size: 15px; font-weight: 600; margin: 0; }
.lp-pplace { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 10px; }
.lp-ptext {
  background: #fff; border: 1px solid var(--rule); padding: 12px;
  font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; line-height: 1.75;
  direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word;
}

/* ---------- dieline preview (signature) ---------- */
.lp-dlwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 26px; }
.lp-dlcol { display: flex; flex-direction: column; align-items: center; }
.lp-dlcap {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px;
}
.lp-dl { width: 100%; max-width: 300px; }
.lp-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; font-size: 12px; color: var(--ink-soft); }
.lp-lgi { display: flex; align-items: center; gap: 7px; }
.lp-sw { width: 22px; height: 11px; border: 1px solid var(--ink); display: inline-block; }

.lp-note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 14px; }

/* ---------- visual ai director ---------- */
.lp-vd { background: var(--panel); border: 1px solid var(--rule); margin-bottom: 14px; }
.lp-vdhead {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; flex-wrap: wrap; padding: 14px 16px 0;
}
.lp-vdkind {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--paper); background: var(--cyan);
  padding: 3px 7px; display: inline-block; margin-bottom: 6px;
}
.lp-vdname { font-size: 16px; font-weight: 600; margin: 0; }
.lp-vdmeta { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; padding: 12px 16px 0; }
.lp-vdcell { padding: 9px 0; }
.lp-vdcell dt {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px;
}
.lp-vdcell dd { margin: 0; font-size: 12.5px; line-height: 1.65; }
.lp-vdfoot { padding: 4px 16px 16px; }

/* ---------- concept ---------- */
.lp-ctrl { background: var(--panel); border: 1px solid var(--rule); padding: 16px; margin-bottom: 18px; }
.lp-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.lp-chip {
  background: #fff; border: 1px solid var(--rule); padding: 8px 13px;
  font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 12.5px;
  cursor: pointer; color: var(--ink-soft);
}
.lp-chip:hover { border-color: var(--ink); color: var(--ink); }
.lp-chip[data-on="1"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.lp-chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.lp-banner {
  border: 1px dashed var(--amber); background: #fff; padding: 11px 14px;
  font-size: 12px; line-height: 1.65; color: var(--ink); margin-bottom: 18px;
}
.lp-banner strong { color: var(--amber); }

.lp-cgrid { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 26px; align-items: start; }
@media (max-width: 720px) { .lp-cgrid { grid-template-columns: 1fr; } }

.lp-swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.lp-swatch { width: 92px; }
.lp-swbox { height: 46px; border: 1px solid var(--rule); }
.lp-swhex { font-family: 'IBM Plex Mono', monospace; font-size: 10px; margin-top: 4px; direction: ltr; text-align: left; }
.lp-swrole { font-size: 11px; color: var(--ink-soft); line-height: 1.4; }

.lp-dir { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 4px; }
.lp-dirq { font-size: 13px; font-weight: 600; margin: 12px 0 3px; }
.lp-dira { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin: 0; }

/* ---------- die-cut ---------- */
.lp-drop {
  border: 2px dashed var(--rule); background: #fff; padding: 26px 18px;
  text-align: center; cursor: pointer; display: block;
}
.lp-drop:hover { border-color: var(--ink); }
.lp-drop b { display: block; font-size: 14px; margin-bottom: 5px; }
.lp-drop span { font-size: 12px; color: var(--ink-soft); line-height: 1.7; }

.lp-dcgrid { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 720px) { .lp-dcgrid { grid-template-columns: 1fr; } }

.lp-dcprev {
  border: 1px solid var(--rule); background: #fff; padding: 12px;
  display: flex; align-items: center; justify-content: center; min-height: 190px;
}
.lp-dcprev svg { max-width: 100%; max-height: 260px; height: auto; }

.lp-readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
.lp-ro { border: 1px solid var(--rule); background: #fff; padding: 10px 12px; }
.lp-rok {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px;
}
.lp-rov { font-family: 'IBM Plex Mono', monospace; font-size: 16px; direction: ltr; text-align: left; }

.lp-fields { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.lp-field { flex: 1 1 110px; min-width: 100px; }
.lp-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
.lp-num {
  width: 100%; background: #fff; border: 1px solid var(--rule); padding: 9px 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; direction: ltr; text-align: left;
}
.lp-num:focus, .lp-sel:focus { outline: 2px solid var(--cyan); outline-offset: -1px; }
.lp-sel {
  width: 100%; background: #fff; border: 1px solid var(--rule); padding: 9px 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px;
}

.lp-shapes { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
.lp-shape {
  background: #fff; border: 1px solid var(--rule); padding: 7px 10px; cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); direction: ltr;
}
.lp-shape:hover { border-color: var(--ink); color: var(--ink); }
.lp-shape[data-on="1"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.lp-ok { border-right: 3px solid var(--cyan); background: #fff; padding: 12px 14px; font-size: 13px; line-height: 1.65; }

/* ---------- artwork upload ---------- */
.lp-artrow {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border: 1px solid var(--rule); background: #fff;
  padding: 9px 12px; margin-bottom: 8px;
}
.lp-artname { flex: 1 1 130px; min-width: 0; font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.lp-artmeta {
  display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 400; color: var(--ink-soft); margin-top: 3px; direction: ltr; text-align: left;
}
.lp-artrow .lp-btn { padding: 7px 12px; font-size: 12px; }

/* ---------- final mockup ---------- */
.lp-faces { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; }
.lp-facewrap { min-width: 0; }
.lp-facecap {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px;
}
.lp-sticker {
  border: 1px solid var(--rule); overflow: hidden; position: relative;
}
.lp-stickerin {
  position: absolute; top: 0; left: 0;
  transform-origin: top left;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
.lp-pad { padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.lp-band { flex: 0 0 auto; }
.lp-logoslot { min-height: 38px; display: flex; align-items: center; justify-content: center; }
.lp-hair { height: 1px; width: 100%; }

.lp-sname {
  font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700;
  font-size: 26px; line-height: 1.05; letter-spacing: -0.015em;
  text-align: center; direction: ltr; overflow-wrap: anywhere;
}
.lp-sclaim {
  font-size: 11px; font-weight: 600; text-align: center; direction: ltr;
  line-height: 1.4; letter-spacing: 0.05em; text-transform: uppercase;
}
.lp-sbadge {
  align-self: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  letter-spacing: 0.1em; padding: 5px 13px; direction: ltr;
  border: 1.5px solid currentColor; border-radius: 999px; text-transform: uppercase;
}
.lp-hero { padding: 8px 12px; }

.lp-sechead { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; direction: ltr; }
.lp-sechead span {
  font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.16em;
  text-transform: uppercase; white-space: nowrap;
}
.lp-sechead i { display: block; height: 1px; flex: 1; opacity: 0.35; }

.lp-sblock { direction: ltr; text-align: left; }
.lp-sbody { font-size: 9px; line-height: 1.5; opacity: 0.88; overflow-wrap: anywhere; }
.lp-slines { display: flex; flex-direction: column; gap: 4px; }
.lp-slines span { display: block; height: 3px; width: 100%; opacity: 0.15; }

.lp-strip { display: grid; gap: 8px; }

.lp-arspace {
  border: 1px dashed currentColor; padding: 9px; text-align: center; opacity: 0.5;
}
.lp-arspace span { display: block; font-size: 10px; }
.lp-arspace em { display: block; font-size: 9.5px; font-style: normal; margin-top: 3px; opacity: 0.8; }

.lp-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
  letter-spacing: 0.08em; direction: ltr; text-transform: uppercase;
}

.lp-order { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.lp-order span {
  border: 1px solid var(--rule); background: #fff; padding: 5px 10px; font-size: 12px;
}
.lp-order b {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--paper); background: var(--ink); padding: 1px 5px; margin-inline-end: 6px;
}

.lp-steps { margin: 10px 0 0; padding-inline-start: 20px; }
.lp-steps li { font-size: 12.5px; line-height: 1.75; color: var(--ink-soft); margin-bottom: 7px; }

/* ---------- product mockup ---------- */
.lp-mockgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-top: 14px; }
.lp-mockcol { min-width: 0; }
.lp-mockshot { border: 1px solid var(--rule); background: #fff; padding: 10px; margin-bottom: 10px; }
.lp-mockshot img { width: 100%; height: auto; max-height: 260px; object-fit: contain; display: block; }
.lp-mockout { border: 1px solid var(--ink); background: #fff; padding: 10px; margin-top: 10px; }
.lp-mockout img { width: 100%; height: auto; display: block; margin-bottom: 10px; }
.lp-mockout a { display: inline-block; text-decoration: none; }


.lp-slot { position: relative; display: flex; align-items: center; justify-content: center; }
.lp-slotimg { max-width: 100%; max-height: 190px; object-fit: contain; display: block; }
.lp-slotempty {
  width: 100%; height: 100%; min-height: inherit; border: 1px dashed currentColor;
  opacity: 0.5; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; cursor: pointer; padding: 10px 8px; text-align: center;
}
.lp-slotempty:hover { opacity: 0.85; }
.lp-slotempty b { font-size: 11px; }
.lp-slotempty span { font-size: 9.5px; }
.lp-slotx {

function extractJSON(raw) {
  const clean = raw.replace(/```json/g, "").replace(/```/g, "").trim();
  const s = clean.indexOf("{");
  const e = clean.lastIndexOf("}");
  if (s === -1 || e === -1 || e <= s) throw new Error("no-json");
  return JSON.parse(clean.slice(s, e + 1));
}

/* Google retires model IDs on a schedule, so each call walks a list
   newest-first and moves on when one returns 404. */
const TEXT_MODELS = ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"];
const IMAGE_MODELS = ["gemini-3.1-flash-image", "gemini-3-pro-image", "gemini-2.5-flash-image"];

const isRetired = (msg) =>
  /http 404/.test(msg) || /no longer available|not found|is not supported/i.test(msg);

/* OpenRouter free slots — tried in order when Gemini can't answer.
   Model names on free tiers churn, so several are listed. */
const OR_MODELS = [
  "meta-llama/llama-3.3-70b-instruct:free",
  "qwen/qwen-2.5-72b-instruct:free",
  "mistralai/mistral-small-3.2-24b-instruct:free",
  "google/gemma-3-27b-it:free",
];

let OR_KEY = "";
const setOpenRouterKey = (k) => { OR_KEY = (k || "").trim(); };

async function askOpenRouterModel(model, system, user) {
  let res;
  try {
    res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${OR_KEY}`,
      },
      body: JSON.stringify({
        model,
        messages: [
          { role: "system", content: system },
          { role: "user", content: user },
        ],
        response_format: { type: "json_object" },
        max_tokens: 2048,
        temperature: 0.7,
      }),
    });
  } catch (e) {
    throw new Error("blocked: " + (e.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json())?.error?.message || ""; } catch { /* not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  const raw = j?.choices?.[0]?.message?.content || "";
  if (!raw.trim()) throw new Error("empty response");
  return extractJSON(raw);
}

async function askOpenRouter(system, user) {
  if (!OR_KEY) throw new Error("no-or-key");
  let last;
  for (const m of OR_MODELS) {
    try {
      return await askOpenRouterModel(m, system, user);
    } catch (e) {
      last = e;
      // A retired or rate-limited free slot means move to the next one.
      if (!isRetired(e.message || "") && !(e.message || "").startsWith("http 429")) throw e;
    }
  }
  throw last;
}


/* Provider key lives in memory only — never written into the file. */
let GEMINI_KEY = "";
const setGeminiKey = (k) => { GEMINI_KEY = (k || "").trim(); };

async function askGeminiModel(model, system, user) {
  const url =
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` +
    encodeURIComponent(GEMINI_KEY);

  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `${system}\n\n---\n\nInput:\n${user}` }] }],
        generationConfig: {
          responseMimeType: "application/json",
          maxOutputTokens: 2048,
          temperature: 0.7,
        },
      }),
    });
  } catch (netErr) {
    throw new Error("blocked: " + (netErr.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try {
      const body = await res.json();
      detail = body?.error?.message || "";
    } catch { /* body was not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  const raw = (j?.candidates?.[0]?.content?.parts || [])
    .map((p) => p.text || "")
    .join("");
  if (!raw.trim()) throw new Error("empty response");
  return extractJSON(raw);
}

async function askGemini(system, user) {
  let last;
  for (const m of TEXT_MODELS) {
    try {
      return await askGeminiModel(m, system, user);
    } catch (e) {
      last = e;
      if (!isRetired(e.message || "")) throw e;
    }
  }
  throw last;
}

async function askClaude(system, user) {
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          { role: "user", content: `${system}\n\n---\n\nInput:\n${user}` },
          { role: "assistant", content: "{" },
        ],
      }),
    });
  } catch (netErr) {
    throw new Error("network: " + (netErr.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try {
      const body = await res.json();
      detail = body?.error?.message || "";
    } catch { /* body was not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  if (j.error) throw new Error(j.error.message || "api-error");

  const raw = (j.content || []).map((c) => (c.type === "text" ? c.text : "")).join("");
  if (!raw.trim()) throw new Error("empty response");

  // The assistant turn was prefilled with "{", so it is not part of the reply.
  const whole = raw.trim().startsWith("{") ? raw : "{" + raw;

  if (j.stop_reason === "max_tokens") {
    try {
      return extractJSON(whole);
    } catch {
      throw new Error("truncated");
    }
  }
  return extractJSON(whole);
}

async function askModel(system, user) {
  // Gemini first, then OpenRouter, then the caller falls back to local.
  if (GEMINI_KEY) {
    try {
      return await askGemini(system, user);
    } catch (e) {
      if (!OR_KEY) throw e;
    }
  }
  if (OR_KEY) return askOpenRouter(system, user);
  return askClaude(system, user);
}

async function askClaudeRetry(system, user, tries = 2) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      return await askModel(system, user);
    } catch (e) {
      last = e;
      const m = e.message || "";
      // A malformed or truncated reply is worth one more shot; a bad request is not.
      const retryable = m.includes("no-json") || m.includes("empty") ||
                        m.includes("network") || m.startsWith("http 5") ||
                        m.includes("overloaded") || m.startsWith("http 429");
      if (!retryable || i === tries - 1) throw last;
      await new Promise((r) => setTimeout(r, 900));
    }
  }
  throw last;
}

function friendlyError(e) {
  const m = (e && e.message) || "";
  if (m === "truncated") return "الوصف طويل فالرد اتقطع. اختصر الوصف وجرّب تاني.";
  if (m.includes("no-json")) return "الرد رجع بشكل مش متوقع. جرّب تاني.";
  if (m.includes("network")) return "مفيش اتصال بالسيرفر. اتأكد من النت وجرّب تاني.";
  if (m.startsWith("http 429")) return "الطلبات كتير دلوقتي. استنى شوية وجرّب تاني.";
  if (m.startsWith("http 4")) return "الطلب اترفض: " + m;
  if (m.startsWith("http 5")) return "السيرفر مش راد دلوقتي. جرّب تاني بعد شوية.";
  return "حصلت مشكلة: " + (m || "سبب غير معروف");
}

/* Pulls the actual body copy out of the description so the mockup can
   show real text instead of grey placeholder lines. */
function parseSections(text) {
  const t = (text || "").replace(/\r/g, "");

  const grab = (heads, stops) => {
    const h = heads.join("|");
    const s = stops.join("|");
    const re = new RegExp(
      `(?:${h})\\s*[:：]?\\s*\\n?([\\s\\S]*?)(?=\\n\\s*(?:${s})\\s*[:：]|$)`, "i");
    const m = t.match(re);
    return m ? m[1].trim() : "";
  };

  const STOPS = [
    "ingredients", "how to use", "directions", "warnings?", "precautions",
    "warnings? ?&? ?precautions", "storage", "store", "for external use",
    "المكونات", "طريقة الاستخدام", "تحذيرات", "التخزين",
  ];

  const clean = (s) =>
    s.split("\n").map((l) => l.replace(/^[\s*•\-–]+/, "").trim())
     .filter((l) => l && !/^[-—]+$/.test(l) && !/[\u0600-\u06FF]/.test(l));

  const usage = clean(grab(["how to use", "directions"], STOPS));
  const warnings = clean(grab(["warnings? ?&? ?precautions", "warnings?", "precautions"], STOPS));
  const storage = clean(grab(["storage", "store in"], STOPS));

  // The description is the first substantial English sentence block.
  const paras = t.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
  const desc = paras.find((p) =>
    p.length > 60 && !/[\u0600-\u06FF]/.test(p) &&
    !/^(ingredients|how to use|warnings|storage)/i.test(p)) || "";

  return {
    desc,
    usage: usage.slice(0, 4),
    warnings: warnings.slice(0, 6),
    storage: storage.slice(0, 3),
  };
}

function parseBrief(text) {
  const t = (text || "").trim();
  const flat = t.replace(/\s+/g, " ");

  // Descriptions often open with a face marker like "FRONT" — that is a
  // section label, not the product name.
  const isMarker = (s) =>
    /^(front|back|face|الوش|الوجه|الضهر|الخلف|الأمامي|الخلفي)\s*[:：-]?\s*$/i.test(s.trim());

  const lines = t.split(/\n/).map((l) => l.trim()).filter(Boolean);
  let first = lines.find((l) => !isMarker(l)) || t;

  let name = first.split(/—|--| - |[:.]/)[0].trim();
  if (name.length > 60) name = name.slice(0, 60).trim();
  if (!name || isMarker(name)) name = "Product";

  // Ingredients: everything after an ingredients marker.
  let ingredients = [];
  const m = flat.match(/(?:ingredients|المكونات|مكونات)\s*[:：]\s*([^.]+)/i);
  if (m) {
    ingredients = m[1]
      .split(/[,،؛;]/)
      .map((x) => x.replace(/\band\b|\bو\b/gi, "").trim())
      .filter((x) => x.length > 1 && x.length < 48)
      .slice(0, 8);
  }

  const has = (re) => re.test(flat);
  const traits = {
    cooling: has(/cool|cold|freeze|menthol|بارد|تبريد|منثول/i),
    warming: has(/warm|heat|hot|دافئ|تدفئة|سخون/i),
    pain: has(/pain|ache|sore|muscle|joint|ألم|وجع|عضل|مفصل/i),
    skin: has(/skin|derma|face|cream|بشرة|جلد|وجه|كريم/i),
    hair: has(/hair|scalp|شعر|فروة/i),
    spray: has(/spray|mist|سبراي|بخاخ|رش/i),
    natural: has(/natural|herbal|botanic|organic|طبيعي|عشبي|نباتي/i),
    kids: has(/kid|child|baby|أطفال|طفل|بيبي/i),
  };

  const medical = traits.pain || has(/topical|relief|therapeutic|علاج|موضعي/i);
  const category = traits.hair ? "hair care"
    : traits.skin ? "skin care"
    : medical ? "topical relief"
    : "personal care";

  return { text: t, name, ingredients, traits, category, medical };
}

const TO_MM = { mm: 1, cm: 10, in: 25.4, pt: 25.4 / 72, pc: 25.4 / 6, px: 25.4 / 96 };
const UNITS = ["mm", "cm", "in", "pt", "px"];

function parseLen(v) {
  if (v === null || v === undefined) return null;
  const m = String(v).trim().match(/^(-?[\d.]+)\s*(mm|cm|in|pt|pc|px|%)?$/);
  if (!m) return null;
  const u = m[2] || "px";
  if (u === "%") return null;
  return { n: parseFloat(m[1]), u };
}

const toMM = (n, u) => n * (TO_MM[u] || TO_MM.px);
const fromMM = (mm, u) => mm / (TO_MM[u] || TO_MM.px);
const round1 = (n) => Math.round(n * 10) / 10;

function gcd(a, b) { return b < 0.0001 ? a : gcd(b, a % b); }
function ratioText(w, h) {
  if (!w || !h) return "—";
  const r = w / h;
  // Try a clean small-integer ratio first, else fall back to decimal.
  for (let d = 1; d <= 12; d++) {
    const n = r * d;
    if (Math.abs(n - Math.round(n)) < 0.02) return `${Math.round(n)}:${d}`;
  }
  return `${round1(r)}:1`;
}

function sanitizeSVG(markup) {
  return markup
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/\son\w+\s*=\s*"[^"]*"/gi, "")
    .replace(/\son\w+\s*=\s*'[^']*'/gi, "")
    .replace(/javascript:/gi, "");
}

/* One prompt per face: it describes the rendered design in full — data,

/* Builds the label prompt for one face, plus a set of extraction prompts

function bgRecipe(styleName, c2) {
  return {

    "Modern & Bold": "a hard-edged diagonal two-tone split, no blur on the dividing edge",

    Minimal: "a completely flat single colour, no gradient",
    "Playful & Colorful": "a diagonal gradient with two large blurred colour circles cropped by the edges",
  }[styleName];
}

/* Prompts that isolate one element from the finished label image, so the

function buildExtractPrompts({ face, data, styleName, palette, productName, slots }) {
  const pal = palette.map((p) => p.hex);
  const [c0, c1, c2, c3] = [pal[0], pal[1], pal[2], pal[3] || pal[2]];
  const TAIL = [
    ``,
    `OUTPUT RULES:`,
    `  Return ONLY that element, alone, centred, on a fully transparent background.`,
    `  No other element from the label may appear, not even partially.`,
    `  Do not add a drop shadow, glow, frame, border, watermark or caption.`,
    `  Preserve the original colours exactly — no hue, saturation or brightness shift.`,
    `  Clean anti-aliased edges with no white fringe or leftover background pixels.`,
    `  Maximum sharpness and resolution, suitable for print at 300 DPI.`,
    `  PNG with a real alpha channel.`,
  ].join("\n");

  const out = [];

  out.push({
    title: "الخلفية لوحدها",
    text:
      `The supplied image is a finished product label.\n\n` +
      `Extract ONLY the background treatment: ${bgRecipe(styleName, c2)}, built from ${pal.join(", ")}.\n` +
      `Remove every piece of text, every photograph or illustration, the logo, the badge,\n` +
      `the hairline rules and the footer content. Rebuild the background so it is complete\n` +
      `and continuous across the whole canvas, filling in wherever content used to sit.\n` +
      `Keep the exact canvas proportion of the supplied image.` + TAIL,
  });

  slots.forEach((s, i) => {
    out.push({
      title: `رسمة: ${s.title}`,
      text:
        `The supplied image is a finished product label.\n\n` +
        `Extract ONLY the ${i === 0 ? "main, largest" : "smaller supporting"} artwork on it` +

        `Cut it away from the label background completely. Do not include the coloured\n` +
        `panel behind it, any text near it, or any rule or edge from the layout.\n` +
        `Reconstruct any part of the subject that the layout was covering, so the\n` +
        `element is whole.` + TAIL,
    });
  });

  out.push({
    title: "شريط اللوجو العلوي (فاضي)",
    text:
      `The supplied image is a finished product label.\n\n` +
      `Extract ONLY the top colour band in ${c2} as an empty graphic shape.\n` +
      `Remove the logo and any text that sits inside it, and rebuild the band so its\n` +
      `colour and any gradient run cleanly and continuously across its full width.\n` +
      `Keep its exact width and height. Do not include the product name or anything below it.` + TAIL,
  });

  out.push({
    title: "الشريط السفلي (فاضي)",
    text:
      `The supplied image is a finished product label.\n\n` +
      `Extract ONLY the bottom footer band in ${c3} as an empty graphic shape.\n` +
      `Remove every piece of text inside it and rebuild the band so its colour runs\n` +
      `cleanly across its full width.\n` +
      `Keep its exact width and height. Do not include anything above it.` + TAIL,

  out.push({
    title: "الخط الفاصل",
    text:
      `The supplied image is a finished product label.\n\n` +

const SYS_REVIEW = `You are a senior packaging designer reviewing a product label design.

Return ONLY valid JSON. No markdown, no backticks, no preamble.

{
 "verdict":"one sentence overall judgement, Egyptian Arabic",
 "strengths":["what genuinely works, Egyptian Arabic, max 18 words each"],
 "suggestions":[{"what":"a concrete change, Egyptian Arabic","why":"why it would help, Egyptian Arabic, max 20 words"}],
 "issues":[{"what":"something actually wrong, Egyptian Arabic","why":"why it matters, Egyptian Arabic, max 20 words"}]
}

Judge only what you can actually see: hierarchy, legibility, contrast, spacing, alignment, colour balance, how the artwork sits with the text, and whether it would read on a shelf.

Be honest. If the design is good, say so and keep suggestions short. If something is broken — text unreadable, elements colliding, uneven margins, leftover interface artefacts, misspelled words — put it in "issues", not "suggestions".

async function askGeminiVision(system, imageDataUrl) {
  if (!GEMINI_KEY) throw new Error("no-key");
  const m = /^data:([^;]+);base64,(.*)$/.exec(imageDataUrl || "");
  if (!m) throw new Error("bad-image");

  let last;
  for (const model of TEXT_MODELS) {
    const url =
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` +
      encodeURIComponent(GEMINI_KEY);
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: m[1], data: m[2] } },
              { text: system },
            ],
          }],
          generationConfig: {
            responseMimeType: "application/json",
            maxOutputTokens: 2048,
            temperature: 0.4,
          },
        }),
      });
    } catch (e) {
      throw new Error("blocked: " + (e.message || "fetch failed"));
    }

    if (res.ok) {
      const j = await res.json();
      const raw = (j?.candidates?.[0]?.content?.parts || [])
        .map((p) => p.text || "").join("");
      if (!raw.trim()) throw new Error("empty response");
      return extractJSON(raw);
    }

    let detail = "";
    try { detail = (await res.json())?.error?.message || ""; } catch { /* not json */ }
    last = new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
    if (!isRetired(last.message)) throw last;
  }
  throw last;
}

/* Vision-capable free slots on OpenRouter, used when Gemini can't look. */
const OR_VISION_MODELS = [
  "meta-llama/llama-4-scout:free",
  "qwen/qwen2.5-vl-72b-instruct:free",
  "google/gemma-3-27b-it:free",
];

async function askOpenRouterVision(system, imageDataUrl) {
  if (!OR_KEY) throw new Error("no-or-key");
  let last;
  for (const model of OR_VISION_MODELS) {
    let res;
    try {
      res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${OR_KEY}`,
        },
        body: JSON.stringify({
          model,
          messages: [{
            role: "user",
            content: [
              { type: "image_url", image_url: { url: imageDataUrl } },
              { type: "text", text: system },
            ],
          }],
          response_format: { type: "json_object" },
          max_tokens: 2048,
          temperature: 0.4,
        }),
      });
    } catch (e) {
      throw new Error("blocked: " + (e.message || "fetch failed"));
    }

    if (res.ok) {
      const j = await res.json();
      const raw = j?.choices?.[0]?.message?.content || "";
      if (!raw.trim()) throw new Error("empty response");
      return extractJSON(raw);
    }

    let detail = "";
    try { detail = (await res.json())?.error?.message || ""; } catch { /* not json */ }
    last = new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
    // A retired or busy free slot means move on; anything else is real.
    if (!isRetired(last.message) && !last.message.startsWith("http 429")) throw last;
  }
  throw last;
}

/* Gemini first, then OpenRouter — same order the text calls use. */
async function askVision(system, imageDataUrl) {
  if (GEMINI_KEY) {

    } catch (e) {
      if (!OR_KEY) throw e;

  throw new Error("no-key");
}

      headers: { Authorization: `Bearer ${key}` },
    });
  } catch (e) {
    throw new Error("blocked: " + (e.message || "fetch failed"));
  }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json())?.error?.message || ""; } catch { /* not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }
  return true;
}

async function verifyGeminiKey(key) {
  let last;
  for (const model of TEXT_MODELS) {
    const url =
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` +
      encodeURIComponent(key);
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "Reply with the single word: ok" }] }],
          generationConfig: { maxOutputTokens: 5 },
        }),
      });
    } catch (e) {
      // The request never left the page — almost always a sandbox that only
      // permits its own host, not a problem with the key.
      throw new Error("blocked: " + (e.message || "fetch failed"));
    }
    if (res.ok) return model;

    let detail = "";
    try { detail = (await res.json())?.error?.message || ""; } catch { /* not json */ }

}

function hexA(hex, a) {
  const h = (hex || "#000000").replace("#", "");
  if (h.length !== 6) return `rgba(0,0,0,${a})`;
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}

function readable(hex) {
  const h = (hex || "#888888").replace("#", "");
  if (h.length !== 6) return "#16181C";
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#16181C" : "#FFFFFF";
}

/* Reads an uploaded artwork file and checks whether it actually
   carries transparency — AI tools often ignore the request for it. */
function readArtImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("مقدرتش أقرا الملف"));
    fr.onload = () => {
      const dataUrl = fr.result;
      const img = new Image();
      img.onerror = () => reject(new Error("مقدرتش أفتح الصورة"));
      img.onload = () => {
        let hasAlpha = false;
        try {
          const S = 90; // sample small — we only need presence of alpha
          const cv = document.createElement("canvas");
          cv.width = S; cv.height = S;
          const ctx = cv.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, S, S);
          const d = ctx.getImageData(0, 0, S, S).data;
          for (let i = 3; i < d.length; i += 4) {
            if (d[i] < 250) { hasAlpha = true; break; }
          }
        } catch { hasAlpha = false; }
        resolve({
          dataUrl,
          name: file.name,
          w: img.naturalWidth,
          h: img.naturalHeight,
          hasAlpha,
        });
      };
      img.src = dataUrl;
    };
    fr.readAsDataURL(file);
  });
}

  const [copied, setCopied] = useState("");

  const [style, setStyle] = useState(STYLES[0]);

  const run = async () => {
    const input = desc.trim();
    if (!input) return;
    setBusy(true); setErr(""); setData(null);

    let split, prompts, usedLocal = false;

    // Both calls are independent, so they run together rather than in sequence.
    setStage("بيقسّم العناصر ويكتب البرومبتات…");
    const [splitRes, promptRes] = await Promise.allSettled([
      askClaudeRetry(SYS_SPLIT, input),
      askClaudeRetry(SYS_PROMPTS, input),
    ]);

    if (splitRes.status === "fulfilled") {
      split = splitRes.value;
    } else {
      split = localSplit(input);
      usedLocal = true;
    }

    if (promptRes.status === "fulfilled" && (promptRes.value.prompts || []).length) {
      prompts = promptRes.value.prompts;
    } else {
      prompts = localPrompts(input).prompts;
      usedLocal = true;
    }

    setData({ ...split, prompts });
    setLocalMode(usedLocal);
    setSpPrompt(null);
    setReview(null); setRevErr("");
    setBusy(false);
    setStage("");
  };

  const copy = async (text, key) => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(key);
      setTimeout(() => setCopied(""), 1600);
    } catch { /* clipboard unavailable */ }
  };

  // --- Feature 1 handlers ---

  const sample = `Melano Massage Spray — topical massage spray with soothing oils and Menthol. Cooling and warming dual action, for joints and muscles pain. Ingredients: Eucalyptus Oil, Turpentine Oil, Methyl Salicylate, Menthol Crystals.`;

  const Face = ({ title, items }) => (
    <div className="lp-face">
      <div className="lp-facehead">
        <span>{title}</span>
        <span>{items.length} EL</span>
      </div>
      {items.map((e, i) => (
        <div className="lp-el" key={i}>
          <div className="lp-elnum">{String(i + 1).padStart(2, "0")}</div>
          <div className="lp-elbody">
            <div className="lp-elen">{e.t}</div>
            {e.ar ? <div className="lp-elar">{e.ar}</div> : null}
            {e.n ? <div className="lp-elnote">{e.n}</div> : null}
          </div>
          <span className="lp-tag">{e.k}</span>
        </div>
      ))}
    </div>
  );

  return (
    <div className="lp-root">
      <style>{CSS}</style>
      <div className="lp-shell">

        <header className="lp-head">
          <div>
            <h1 className="lp-title">تجهيز عناصر الاستيكر</h1>
            <p className="lp-sub">
              الصق وصف المنتج، وهتطلع بتقسيم العناصر لوش وضهر، برومبتات جاهزة
              لأداة توليد الصور، ومعاينة مبدئية لشكل الملصق قبل ما المصمم يبدأ.
            </p>
          </div>
          <div className="lp-stamp">LABEL PREP / v1</div>
        </header>

        <div className="lp-inputwrap">
          <label className="lp-label" htmlFor="apikey">
            مفتاح Gemini (اختياري)
          </label>
          <p className="lp-hint">
            من غير مفتاح الأداة شغالة بالمحرّك المحلي. مع المفتاح الصياغة بتبقى أذكى.
            المفتاح بيفضل في المتصفح بتاعك بس ومش بيتحفظ في الملف — كل واحد يحط مفتاحه.
            <br />
            <b>مهم:</b> المفتاح بيشتغل في ملف الـ HTML لما تفتحه على جهازك.
            جوه Claude النداء لجوجل بيتحجب، فالأداة بتكمل بالمحرّك المحلي.
          </p>
          <div className="lp-row" style={{ marginTop: 0 }}>
            <input
              id="apikey"
              className="lp-ta"
              type={showKey ? "text" : "password"}
              style={{ minHeight: 0, height: 42, flex: "1 1 240px", direction: "ltr", textAlign: "left" }}
              value={apiKey}
              onChange={(e) => onKeyChange(e.target.value)}
              placeholder="AIza…"
              autoComplete="off"
              spellCheck="false"
            />
            <button className="lp-btn lp-btn-ghost" onClick={() => setShowKey((v) => !v)}>
              {showKey ? "إخفاء" : "إظهار"}
            </button>
            {keyState === "checking" ? <span className="lp-keychk">بيتأكد…</span> : null}
            {keyState === "ok" ? (
              <span className="lp-keyok">
                اشتغل يا حوده ✓
                {keyMsg ? <em className="lp-keymodel">{keyMsg}</em> : null}
              </span>
            ) : null}
            {keyState === "bad" ? <span className="lp-keybad">{keyMsg}</span> : null}
          </div>

          <label className="lp-label" htmlFor="orkey" style={{ marginTop: 18 }}>
            مفتاح OpenRouter (احتياطي)
          </label>
          <p className="lp-hint">
            لو مفتاح جيميني فشل أو خلصت حصته، الأداة بتكمّل على ده تلقائيًا من غير ما توقف.
            مجاني بحد يومي، وبيتاخد من openrouter.ai.
          </p>
          <div className="lp-row" style={{ marginTop: 0 }}>
            <input
              id="orkey"
              className="lp-ta"
              type={showKey ? "text" : "password"}
              style={{ minHeight: 0, height: 42, flex: "1 1 240px", direction: "ltr", textAlign: "left" }}
              value={orKey}
              onChange={(e) => onOrKeyChange(e.target.value)}
              placeholder="sk-or-…"
              autoComplete="off"
              spellCheck="false"
            />
            {orState === "checking" ? <span className="lp-keychk">بيتأكد…</span> : null}
            {orState === "ok" ? <span className="lp-keyok">جاهز كاحتياطي ✓</span> : null}
            {orState === "bad" ? <span className="lp-keybad">{orMsg}</span> : null}
          </div>
        </div>

        <div className="lp-inputwrap">
          <label className="lp-label" htmlFor="pname">اسم المنتج</label>
          <p className="lp-hint">
            الاسم اللي هيتكتب على العبوة. لو سبته فاضي هياخده من الوصف.
          </p>
          <input
            id="pname"
            className="lp-ta"
            style={{ minHeight: 0, height: 44 }}
            value={pname}
            onChange={(e) => setPname(e.target.value)}
            placeholder="مثال: Melano Massage Spray"
          />

          <label className="lp-label" htmlFor="desc" style={{ marginTop: 18 }}>وصف المنتج</label>
          <p className="lp-hint">
            اكتب الاسم، الاستخدام، المكونات، وأي ادعاءات على العبوة. عربي أو إنجليزي أو الاتنين.
          </p>
          <textarea
            id="desc"
            className="lp-ta"
            value={desc}
            onChange={(e) => setDesc(e.target.value)}
            placeholder="مثال: سبراي مساج موضعي بزيوت مهدئة ومنثول، لألم المفاصل والعضلات، بمفعول تبريد وتدفئة…"
          />
          <div className="lp-row">
            <button className="lp-btn" onClick={run} disabled={busy || !desc.trim()}>
              {busy ? (stage || "بيجهّز…") : "جهّز العناصر"}
            </button>
            <button className="lp-btn lp-btn-ghost" onClick={() => setDesc(sample)} disabled={busy}>
              جرّب بمثال
            </button>
          </div>
          {err ? <div className="lp-err">{err}</div> : null}
        </div>

        {data ? (
          <div className="lp-inputwrap lp-spwrap">
            <p className="lp-eyebrow" style={{ marginBottom: 8 }}>برومبت الاستيكر</p>
            <p className="lp-hint">
              اختار الاتجاه البصري الأول، وبعدين ولّد البرومبت. كل اتجاه ليه ألوان
              وخلفية مختلفة.
            </p>

            <div className="lp-chips" role="group" aria-label="الاتجاه البصري">
              {STYLES.map((s, i) => (
                <button key={s} className="lp-chip" data-on={spIdea === i ? 1 : 0}
                        onClick={() => { setSpIdea(i); if (spPrompt) makeStickerPrompt(i); }}
                        aria-pressed={spIdea === i}>
                  <span className="lp-chipdots">
                    {(PALETTES[s] || []).slice(0, 4).map((c, n) => (
                      <i key={n} style={{ background: c.hex }} />
                    ))}
                  </span>
                  {s}
                </button>
              ))}
            </div>

            <div className="lp-row">
              <button className="lp-btn" onClick={() => makeStickerPrompt(spIdea)}>
                {spPrompt ? "ولّد تاني" : "توليد برومبت استيكر بالبيانات"}
              </button>
              <button className="lp-btn lp-btn-ghost"
                      onClick={() => makeStickerPrompt(spIdea + 1)}>
                جرّب الاتجاه اللي بعده
              </button>
            </div>

            {spPrompt ? (
              <>
                <div className="lp-banner" style={{ marginTop: 16 }}>
                  <strong>ارفع لوجو الشركة مع البرومبت.</strong>{" "}
                  البرومبت بيقول لأداة الصور تستخدم اللوجو المرفوع ومتخترعش واحد من عندها —
                  فمن غيره هتلاقي علامة تجارية وهمية على الاستيكر.
                </div>

                {spPrompt.faces.map((f) => (
                  <div key={f.face} className="lp-faceblock">
                    <p className="lp-eyebrow" style={{ marginTop: 4 }}>{f.label}</p>

                    <div className="lp-order">
                      <span><b>1</b> اللوجو</span>
                      {f.slots.map((x, i) => (
                        <span key={i}><b>{i + 2}</b> {x.title}</span>
                      ))}
                    </div>

                    <div className="lp-phead" style={{ marginTop: 12 }}>
                      <span className="lp-plabel">Sticker prompt</span>
                      <button className="lp-btn lp-btn-ghost"
                              onClick={() => copy(f.sticker.text, "sp-" + f.face)}>
                        {copied === "sp-" + f.face ? "اتنسخ" : "Copy Prompt"}
                      </button>
                    </div>
                    <div className="lp-ptext">{f.sticker.text}</div>

                    <details className="lp-extract">
                      <summary>
                        برومبتات استخراج العناصر
                        <b>{f.extracts.length}</b>
                      </summary>
                      <p className="lp-hint" style={{ padding: "0 12px 6px" }}>
                        بعد ما تطلّع صورة الاستيكر، ارفعها مع كل برومبت من دول عشان
                        تطلّع العنصر ده لوحده بخلفية شفافة.
                      </p>
                      {f.extracts.map((x, i) => (
                        <div key={i} className="lp-exrow">
                          <div className="lp-phead">
                            <span className="lp-plabel">{x.title}</span>
                            <button className="lp-btn lp-btn-ghost"
                                    onClick={() => copy(x.text, `ex-${f.face}-${i}`)}>
                              {copied === `ex-${f.face}-${i}` ? "اتنسخ" : "Copy"}
                            </button>
                          </div>
                          <div className="lp-ptext">{x.text}</div>
                        </div>
                      ))}
                    </details>
                  </div>
                ))}

                <div className="lp-swatches" style={{ marginTop: 18 }}>
                  {spPrompt.palette.map((c, i) => (
                    <div className="lp-swatch" key={i}>
                      <div className="lp-swbox" style={{ background: c.hex }} />
                      <div className="lp-swhex">{c.hex}</div>
                      <div className="lp-swrole">{c.role}</div>
                    </div>
                  ))}
                </div>

                <div className="lp-dir" style={{ marginTop: 6 }}>
                  <p className="lp-eyebrow">ليه الاختيارات دي؟</p>
                  {spPrompt.why.map((d, i) => (
                    <div key={i}>
                      <p className="lp-dirq">{d.q}</p>
                      <p className="lp-dira">{d.a}</p>
                    </div>
                  ))}
                </div>
              </>
            ) : null}
          </div>
        ) : null}

        {data && localMode ? (
          <p className="lp-eyebrow" style={{ marginTop: -2, marginBottom: 18 }}>
            اتولّد محليًا — <b>من غير AI</b>
          </p>
        ) : null}

        {data ? (
          <>
            <div className="lp-tabs" role="tablist">
              <button className="lp-tab" data-on={1} role="tab" aria-selected={true}>
                تحليل
              </button>
            </div>

            <p className="lp-eyebrow">
              ارفع تصميم الاستيكر — <b>مراجعة واقتراحات</b>
            </p>

            <div className="lp-ctrl">
              <p className="lp-hint" style={{ marginBottom: 12 }}>
                ارفع صورة التصميم (استيكر، عبوة، أو أي مرحلة من الشغل) وهيترد عليك
                بمراجعة: إيه الكويس فيه، وإيه اللي ينفع يتضاف أو يتظبط وليه.
              </p>

              <div className="lp-mockshot" style={{ maxWidth: 320 }}>
                {revImg ? (
                  <img src={revImg.dataUrl} alt="التصميم المرفوع" />
                ) : (
                  <label className="lp-slotempty" htmlFor="revfile" style={{ minHeight: 140 }}>
                    <b>ارفع صورة التصميم</b>
                    <span>PNG أو JPG</span>
                  </label>
                )}
                <input id="revfile" type="file" style={{ display: "none" }}
                       accept="image/png,image/webp,image/jpeg"
                       onChange={(e) => pickReview(e.target.files?.[0])} />
              </div>

              <div className="lp-row">
                <button className="lp-btn" onClick={runReview}
                        disabled={!revImg || revBusy}>
                  {revBusy ? "بيحلل…" : review ? "حلّل تاني" : "حلّل التصميم"}
                </button>
                {revImg ? (
                  <label className="lp-btn lp-btn-ghost" htmlFor="revfile"
                         style={{ cursor: "pointer" }}>غيّر الصورة</label>
                ) : null}
              </div>

              {revErr ? <div className="lp-err">{revErr}</div> : null}

              {!GEMINI_KEY && !OR_KEY ? (
                <div className="lp-banner" style={{ marginTop: 12 }}>
                  <strong>الخطوة دي محتاجة مفتاح.</strong>{" "}
                  التحليل بيحتاج الأداة تشوف الصورة، وده مش بيشتغل بالمحرّك المحلي.
                  حط مفتاح Gemini أو OpenRouter في أول الصفحة.
                </div>
              ) : null}
            </div>

            {review ? (
              <>
                {review.verdict ? (
                  <div className="lp-ok" style={{ marginBottom: 16 }}>{review.verdict}</div>
                ) : null}

                {(review.strengths || []).length ? (
                  <div className="lp-dir">
                    <p className="lp-eyebrow">المميزات</p>
                    <ul className="lp-steps">
                      {review.strengths.map((s, i) => <li key={i}>{s}</li>)}
                    </ul>
                  </div>
                ) : null}

                {(review.suggestions || []).length ? (
                  <div className="lp-dir" style={{ marginTop: 18 }}>
                    <p className="lp-eyebrow">اقتراحات</p>
                    {review.suggestions.map((s, i) => (
                      <div key={i}>
                        <p className="lp-dirq">{s.what}</p>
                        <p className="lp-dira">{s.why}</p>
                      </div>
                    ))}
                  </div>
                ) : null}

                {(review.issues || []).length ? (
                  <div className="lp-dir" style={{ marginTop: 18 }}>
                    <p className="lp-eyebrow">محتاج انتباه</p>
                    {review.issues.map((s, i) => (
                      <div key={i}>
                        <p className="lp-dirq">{s.what}</p>
                        <p className="lp-dira">{s.why}</p>
                      </div>
                    ))}
                  </div>
                ) : null}

                <p className="lp-note">
                  ده رأي آلي على الشكل البصري، مش مراجعة تنظيمية ولا قانونية.
                  البيانات الإلزامية على العبوة مسؤولية الجهة المختصة عندكم.
                </p>
              </>
            ) : null}
          </>
        ) : null}

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<LabelPrepTool />);
</script>
</body>
</html>
