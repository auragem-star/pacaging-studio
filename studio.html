<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packaging Dieline Studio Generator | Melano Dieline</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div style="display:flex;flex-direction:column;height:100vh;overflow:hidden;">
    
    <!-- Top Navbar Header -->
    <header class="top" style="flex:none;">
      <div class="wrap navbar" style="height:60px;">
        <a href="index.html" class="brand">
          <div class="brand-icon" style="width:34px;height:34px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          </div>
          <div class="nm" style="font-size:16px;">MELANO <span>STUDIO</span></div>
        </a>

        <div style="margin-left:20px;font-family:var(--head);font-weight:700;font-size:15px;color:var(--ink);" id="studio-box-name">
          Reverse Tuck End
        </div>

        <div class="top-cta" style="margin-left:auto;">
          <button id="lang-toggle-btn" class="btn btn-line btn-sm" onclick="toggleLanguage()">عربي</button>
          <button class="btn btn-line btn-sm" onclick="triggerExport('dxf')">Export DXF</button>
          <button class="btn btn-line btn-sm" onclick="triggerExport('pdf')">Export PDF</button>
          <button class="btn btn-primary btn-sm" onclick="triggerExport('svg')">Export Vector SVG</button>
        </div>
      </div>
    </header>

    <!-- Main Workspace Studio Layout -->
    <div style="display:grid;grid-template-columns:300px 1fr 280px;flex:1;overflow:hidden;background:var(--bg);">
      
      <!-- Left Panel: Dimensions & Parameters -->
      <aside style="background:var(--card);border-right:1px solid var(--line);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;">
        <div>
          <label style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;">Box Structure Template</label>
          <select id="box-style-select" class="sv-num" style="width:100%;font-size:13px;padding:8px;" onchange="changeBoxStyle(this.value)">
            <!-- Populated via JS -->
          </select>
        </div>

        <div style="padding-top:12px;border-top:1px solid var(--line);">
          <label style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:12px;">Dimensions (mm)</label>

          <div class="sv-drow">
            <div class="dh"><b>Length (L)</b> <em>mm</em></div>
            <div class="db"><input type="number" id="inp-L" class="num" value="120" min="20" max="1000" oninput="updateDieline()"></div>
          </div>

          <div class="sv-drow" style="margin-top:10px;">
            <div class="dh"><b>Width (W)</b> <em>mm</em></div>
            <div class="db"><input type="number" id="inp-W" class="num" value="60" min="15" max="1000" oninput="updateDieline()"></div>
          </div>

          <div class="sv-drow" style="margin-top:10px;">
            <div class="dh"><b>Height (H)</b>  preliminary <em>mm</em></div>
            <div class="db"><input type="number" id="inp-H" class="num" value="140" min="30" max="1200" oninput="updateDieline()"></div>
          </div>
        </div>

        <div style="padding-top:12px;border-top:1px solid var(--line);">
          <label style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:12px;">Prepress & Caliper</label>

          <div class="sv-drow">
            <div class="dh"><b>Board Caliper (t)</b> <em>mm</em></div>
            <div class="db"><input type="number" id="inp-t" class="num" value="0.5" step="0.1" min="0.1" max="10" oninput="updateDieline()"></div>
          </div>

          <div class="sv-drow" style="margin-top:10px;">
            <div class="dh"><b>Bleed Margin</b> <em>mm</em></div>
            <div class="db"><input type="number" id="inp-bleed" class="num" value="3" min="0" max="20" oninput="updateDieline()"></div>
          </div>

          <div class="sv-drow" style="margin-top:10px;">
            <div class="dh"><b>Tuck Flap</b> <em>mm</em></div>
            <div class="db"><input type="number" id="inp-tuck" class="num" value="15" min="5" max="50" oninput="updateDieline()"></div>
          </div>
        </div>
      </aside>

      <!-- Center Viewport Canvas (2D Flat SVG / 3D WebGL) -->
      <main style="position:relative;background:#F8FAFC;display:flex;flex-direction:column;overflow:hidden;">
        <!-- View Switcher -->
        <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:3px;background:rgba(255,255,255,0.9);border:1px solid var(--line-2);border-radius:999px;box-shadow:var(--sh-2);">
          <button id="btn-2d" class="btn btn-sm btn-primary" style="padding:6px 14px;font-size:12px;" onclick="switchView('2d')">2D Flat Dieline</button>
          <button id="btn-3d" class="btn btn-sm btn-line" style="padding:6px 14px;font-size:12px;" onclick="switchView('3d')">3D Folding Box</button>
        </div>

        <!-- 2D SVG Canvas -->
        <div id="cad-canvas" class="sv-board">
          <div class="sv-canvas" id="svg-render-area">
            <!-- SVG rendered dynamically -->
          </div>
        </div>

        <!-- 3D Three.js Canvas -->
        <div id="d3-viewport" style="width:100%;height:100%;display:none;position:absolute;inset:0;"></div>

        <!-- Floating 3D Fold Slider -->
        <div id="fold-bar" style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:12px;padding:8px 18px;background:rgba(255,255,255,0.95);border:1px solid var(--line-2);border-radius:999px;box-shadow:var(--sh-3);">
          <span style="font-size:12px;font-weight:700;">3D Fold:</span>
          <input type="range" id="fold-range" min="0" max="100" value="0" style="width:160px;accent-color:var(--sky);" oninput="onFoldSliderChange(this.value)">
          <span id="fold-val" style="font-family:var(--mono);font-size:12px;font-weight:700;">0%</span>
        </div>
      </main>

      <!-- Right Panel: Prepress Vector Layers -->
      <aside style="background:var(--card);border-left:1px solid var(--line);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;">
        <label style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);display:block;">Production Layers</label>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:var(--r-xs);border:1px solid var(--line);">
          <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;">
            <span style="width:12px;height:12px;border-radius:2px;background:#FF0000;"></span> Cut Line (#FF0000)
          </div>
          <input type="checkbox" id="chk-cut" checked onchange="updateDieline()">
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:var(--r-xs);border:1px solid var(--line);">
          <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;">
            <span style="width:12px;height:12px;border-radius:2px;background:#0000FF;"></span> Crease Score (#0000FF)
          </div>
          <input type="checkbox" id="chk-crease" checked onchange="updateDieline()">
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:var(--r-xs);border:1px solid var(--line);">
          <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;">
            <span style="width:12px;height:12px;border-radius:2px;background:#00FF00;"></span> Bleed Area (#00FF00)
          </div>
          <input type="checkbox" id="chk-bleed" checked onchange="updateDieline()">
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:var(--r-xs);border:1px solid var(--line);">
          <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;">
            <span style="width:12px;height:12px;border-radius:2px;background:#334155;"></span> Dimensions
          </div>
          <input type="checkbox" id="chk-dim" checked onchange="updateDieline()">
        </div>

        <div style="padding-top:14px;border-top:1px solid var(--line);margin-top:auto;">
          <button class="btn btn-line" style="width:100%;" onclick="triggerExport('png')">Download High-Res PNG</button>
        </div>
      </aside>

    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="dieline-engine.js"></script>
  <script src="d3d-engine.js"></script>
  <script src="exporter.js"></script>
  <script>
    let currentBoxStyle = 'rte';
    let d3Instance = null;
    let currentBoxData = null;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('style')) {
        currentBoxStyle = urlParams.get('style');
      }

      populateStyleSelect();
      updateDieline();
    });

    function populateStyleSelect() {
      const select = document.getElementById('box-style-select');
      select.innerHTML = BOX_TEMPLATES.map(b => `
        <option value="${b.id}" ${b.id === currentBoxStyle ? 'selected' : ''}>${b.name}</option>
      `).join('');
    }

    function getParams() {
      return {
        L: parseFloat(document.getElementById('inp-L').value) || 120,
        W: parseFloat(document.getElementById('inp-W').value) || 60,
        H: parseFloat(document.getElementById('inp-H').value) || 140,
        t: parseFloat(document.getElementById('inp-t').value) || 0.5,
        bleed: parseFloat(document.getElementById('inp-bleed').value) || 3,
        tuck: parseFloat(document.getElementById('inp-tuck').value) || 15,
        unit: 'mm'
      };
    }

    function updateDieline() {
      const params = getParams();
      currentBoxData = window.dielineEngine.generateBoxData(currentBoxStyle, params);

      const options = {
        showCut: document.getElementById('chk-cut').checked,
        showCrease: document.getElementById('chk-crease').checked,
        showBleed: document.getElementById('chk-bleed').checked,
        showDim: document.getElementById('chk-dim').checked
      };

      document.getElementById('svg-render-area').innerHTML = window.dielineEngine.renderSVG(currentBoxData, options);

      if (d3Instance) {
        d3Instance.buildBoxModel(params);
      }
    }

    function changeBoxStyle(styleId) {
      currentBoxStyle = styleId;
      const bObj = BOX_TEMPLATES.find(x => x.id === styleId);
      if (bObj) {
        document.getElementById('studio-box-name').textContent = bObj.name;
      }
      updateDieline();
    }

    function switchView(mode) {
      document.getElementById('btn-2d').className = mode === '2d' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-line';
      document.getElementById('btn-3d').className = mode === '3d' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-line';

      const cadCanvas = document.getElementById('cad-canvas');
      const d3Viewport = document.getElementById('d3-viewport');
      const foldBar = document.getElementById('fold-bar');

      if (mode === '3d') {
        cadCanvas.style.display = 'none';
        d3Viewport.style.display = 'block';
        foldBar.style.display = 'flex';

        if (!d3Instance) {
          d3Instance = new window.d3dEngine('d3-viewport');
        }
        d3Instance.buildBoxModel(getParams());
      } else {
        cadCanvas.style.display = 'grid';
        d3Viewport.style.display = 'none';
        foldBar.style.display = 'none';
      }
    }

    function onFoldSliderChange(val) {
      document.getElementById('fold-val').textContent = val + '%';
      if (d3Instance) d3Instance.updateFoldProgress(parseFloat(val));
    }

    function triggerExport(format) {
      if (!currentBoxData) return;
      const filename = `melano-${currentBoxStyle}.${format}`;
      if (format === 'svg') window.dielineExporter.exportSVG(currentBoxData, filename);
      if (format === 'pdf') window.dielineExporter.exportPDF(currentBoxData, filename);
      if (format === 'dxf') window.dielineExporter.exportDXF(currentBoxData, filename);
      if (format === 'png') {
        const svgEl = document.querySelector('#svg-render-area svg');
        if (svgEl) window.dielineExporter.exportPNG(svgEl, filename);
      }
    }
  </script>
</body>
</html>
