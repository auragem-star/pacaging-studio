<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استوديو الدايكت ومحاكاة 3D | ميلانو ديلاين (Melano Studio)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="studio-container">
    <!-- Top Bar Toolbar -->
    <header class="studio-header">
      <div class="studio-title-group">
        <a href="index.html" class="brand">
          <div class="brand-icon" style="width:34px;height:34px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          </div>
          <div class="brand-name" style="font-size:16px;">MELANO <span>STUDIO</span></div>
        </a>
        <h1 id="selected-box-title" style="font-size:15px;color:var(--muted);font-weight:500;">
          Reverse Tuck End (RTE)
        </h1>
      </div>

      <div class="header-actions">
        <button id="lang-toggle-btn" class="btn btn-outline btn-sm" onclick="toggleLanguage()">English</button>
        <button class="btn btn-outline btn-sm" onclick="triggerExport('dxf')" data-i18n="exportDXF">تصدير DXF</button>
        <button class="btn btn-outline btn-sm" onclick="triggerExport('pdf')" data-i18n="exportPDF">تصدير PDF</button>
        <button class="btn btn-primary btn-sm" onclick="triggerExport('svg')" data-i18n="exportSVG">تصدير SVG</button>
      </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="studio-body">
      
      <!-- Left Panel: Dimension Parameters -->
      <aside class="studio-panel-left">
        <div class="control-group">
          <div class="control-group-header">
            <span>نوع قالب العلبة</span>
          </div>
          <select id="box-style-select" class="input-field" style="width:100%;text-align:right;" onchange="changeBoxStyle(this.value)">
            <!-- Populated via JS -->
          </select>
        </div>

        <div class="control-group">
          <div class="control-group-header">
            <span>الأبعاد الرئيسية</span>
            <span class="unit-badge">mm</span>
          </div>

          <div class="input-row">
            <label data-i18n="dimLength">الطول (L) <small>Length</small></label>
            <input type="number" id="inp-L" class="input-field" value="120" min="20" max="1000" oninput="updateDieline()">
          </div>

          <div class="input-row">
            <label data-i18n="dimWidth">العرض (W) <small>Width</small></label>
            <input type="number" id="inp-W" class="input-field" value="60" min="15" max="1000" oninput="updateDieline()">
          </div>

          <div class="input-row">
            <label data-i18n="dimHeight">الارتفاع (H) <small>Height</small></label>
            <input type="number" id="inp-H" class="input-field" value="140" min="30" max="1200" oninput="updateDieline()">
          </div>
        </div>

        <div class="control-group">
          <div class="control-group-header">
            <span>تفاصيل الـ Prepress والخامة</span>
          </div>

          <div class="input-row">
            <label data-i18n="dimCaliper">سمك الخامة (t) <small>Caliper</small></label>
            <input type="number" id="inp-t" class="input-field" value="0.5" step="0.1" min="0.1" max="10" oninput="updateDieline()">
          </div>

          <div class="input-row">
            <label data-i18n="dimBleed">هامش الطباعة <small>Bleed</small></label>
            <input type="number" id="inp-bleed" class="input-field" value="3" min="0" max="20" oninput="updateDieline()">
          </div>

          <div class="input-row">
            <label data-i18n="dimTuck">لسان الغلق <small>Tuck Flap</small></label>
            <input type="number" id="inp-tuck" class="input-field" value="15" min="5" max="50" oninput="updateDieline()">
          </div>

          <div class="input-row">
            <label data-i18n="dimGlue">لسان اللصق <small>Glue Tab</small></label>
            <input type="number" id="inp-glue" class="input-field" value="15" min="8" max="40" oninput="updateDieline()">
          </div>
        </div>

        <div class="control-group">
          <div class="control-group-header">
            <span>وحدة القياس</span>
          </div>
          <div class="segment-control">
            <button class="active" onclick="setUnit('mm')">mm</button>
            <button onclick="setUnit('cm')">cm</button>
            <button onclick="setUnit('in')">in</button>
          </div>
        </div>
      </aside>

      <!-- Center Viewport (2D CAD Canvas & 3D Three.js Simulator) -->
      <main class="studio-viewport">
        <!-- Viewport Switcher Tabs -->
        <div class="viewport-tabs">
          <button id="btn-view-2d" class="active" onclick="switchView('2d')" data-i18n="view2D">مخطط فلات 2D</button>
          <button id="btn-view-3d" onclick="switchView('3d')" data-i18n="view3D">مجسم العلبة 3D</button>
        </div>

        <!-- 2D SVG Canvas Container -->
        <div id="cad-canvas" class="cad-canvas-wrapper">
          <!-- Rendered SVG -->
        </div>

        <!-- 3D WebGL Canvas Container -->
        <div id="d3-viewport"></div>

        <!-- Floating Bottom Bar (3D Fold Slider) -->
        <div class="floating-bottom-bar" id="fold-bar" style="display:none;">
          <div class="fold-slider-container">
            <span style="font-size:12px;font-weight:700;" data-i18n="foldProgress">طي العلبة 3D:</span>
            <input type="range" id="fold-range" min="0" max="100" value="0" oninput="onFoldSliderChange(this.value)">
            <span id="fold-value-text" style="font-family:var(--mono);font-size:12px;font-weight:700;">0%</span>
          </div>
        </div>
      </main>

      <!-- Right Panel: Prepress Layers & Material Settings -->
      <aside class="studio-panel-right">
        <div class="control-group">
          <div class="control-group-header">
            <span>طبقات رسم الدايكت</span>
          </div>

          <div class="layer-item">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="layer-color-indicator color-cut"></span>
              <span data-i18n="layerCut">Cut Line (#FF0000)</span>
            </div>
            <input type="checkbox" id="chk-cut" checked onchange="updateDieline()">
          </div>

          <div class="layer-item">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="layer-color-indicator color-crease"></span>
              <span data-i18n="layerCrease">Crease Score (#0000FF)</span>
            </div>
            <input type="checkbox" id="chk-crease" checked onchange="updateDieline()">
          </div>

          <div class="layer-item">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="layer-color-indicator color-bleed"></span>
              <span data-i18n="layerBleed">Bleed Area (#00FF00)</span>
            </div>
            <input type="checkbox" id="chk-bleed" checked onchange="updateDieline()">
          </div>

          <div class="layer-item">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="layer-color-indicator color-dim"></span>
              <span data-i18n="layerDimensions">Dimensions Annotation</span>
            </div>
            <input type="checkbox" id="chk-dim" checked onchange="updateDieline()">
          </div>
        </div>

        <div class="control-group">
          <div class="control-group-header">
            <span>خامة الورق والكرتون (3D)</span>
          </div>
          <select id="material-select" class="input-field" style="width:100%;text-align:right;" onchange="changeMaterial(this.value)">
            <option value="white" data-i18n="materialWhite">ورق مقوى أبيض (White Cardboard)</option>
            <option value="kraft" data-i18n="materialKraft">كرتون كرافت بني (Kraft Paper)</option>
            <option value="corrugated" data-i18n="materialCorrugated">كرتون مضلع (Corrugated Flute)</option>
          </select>
        </div>

        <div class="control-group">
          <div class="control-group-header">
            <span>تصدير الملفات</span>
          </div>
          <button class="btn btn-outline" style="width:100%;" onclick="triggerExport('png')" data-i18n="exportPNG">تحميل صورة PNG</button>
        </div>
      </aside>

    </div>
  </div>

  <!-- Toast Notification element -->
  <div id="toast" class="toast">تم التصدير بنجاح ✨</div>

  <script src="i18n.js"></script>
  <script src="dieline-engine.js"></script>
  <script src="d3d-engine.js"></script>
  <script src="exporter.js"></script>
  <script>
    let currentBoxStyle = 'rte';
    let currentUnit = 'mm';
    let activeViewMode = '2d';
    let d3Instance = null;
    let currentBoxData = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Parse URL params for ?style=
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('style')) {
        currentBoxStyle = urlParams.get('style');
      }

      populateStyleSelect();
      updateDieline();
    });

    function populateStyleSelect() {
      const select = document.getElementById('box-style-select');
      const lang = localStorage.getItem('melano_lang') || 'ar';
      
      select.innerHTML = BOX_TEMPLATES.map(b => `
        <option value="${b.id}" ${b.id === currentBoxStyle ? 'selected' : ''}>
          ${b.code} - ${lang === 'ar' ? b.nameAr : b.nameEn}
        </option>
      `).join('');
    }

    function getParams() {
      return {
        L: parseFloat(document.getElementById('inp-L').value) || 100,
        W: parseFloat(document.getElementById('inp-W').value) || 60,
        H: parseFloat(document.getElementById('inp-H').value) || 140,
        t: parseFloat(document.getElementById('inp-t').value) || 0.5,
        bleed: parseFloat(document.getElementById('inp-bleed').value) || 3,
        tuck: parseFloat(document.getElementById('inp-tuck').value) || 15,
        glue: parseFloat(document.getElementById('inp-glue').value) || 15,
        unit: currentUnit
      };
    }

    function updateDieline() {
      const params = getParams();
      currentBoxData = window.dielineEngine.generateBoxData(currentBoxStyle, params);

      const options = {
        showCut: document.getElementById('chk-cut').checked,
        showCrease: document.getElementById('chk-crease').checked,
        showBleed: document.getElementById('chk-bleed').checked,
        showDim: document.getElementById('chk-dim').checked
      };

      const svgContainer = document.getElementById('cad-canvas');
      svgContainer.innerHTML = window.dielineEngine.renderSVG(currentBoxData, options);

      if (d3Instance) {
        d3Instance.buildBoxModel(params);
      }
    }

    function changeBoxStyle(styleId) {
      currentBoxStyle = styleId;
      const bObj = BOX_TEMPLATES.find(x => x.id === styleId);
      if (bObj) {
        const lang = localStorage.getItem('melano_lang') || 'ar';
        document.getElementById('selected-box-title').textContent = `${bObj.code} - ${lang === 'ar' ? bObj.nameAr : bObj.nameEn}`;
      }
      updateDieline();
    }

    function switchView(mode) {
      activeViewMode = mode;
      document.getElementById('btn-view-2d').classList.toggle('active', mode === '2d');
      document.getElementById('btn-view-3d').classList.toggle('active', mode === '3d');

      const cadCanvas = document.getElementById('cad-canvas');
      const d3Viewport = document.getElementById('d3-viewport');
      const foldBar = document.getElementById('fold-bar');

      if (mode === '3d') {
        cadCanvas.style.display = 'none';
        d3Viewport.classList.add('active');
        foldBar.style.display = 'flex';

        if (!d3Instance) {
          d3Instance = new window.d3dEngine('d3-viewport');
        }
        d3Instance.buildBoxModel(getParams());
      } else {
        cadCanvas.style.display = 'grid';
        d3Viewport.classList.remove('active');
        foldBar.style.display = 'none';
      }
    }

    function onFoldSliderChange(val) {
      document.getElementById('fold-value-text').textContent = val + '%';
      if (d3Instance) {
        d3Instance.updateFoldProgress(parseFloat(val));
      }
    }

    function changeMaterial(mat) {
      if (d3Instance) {
        d3Instance.setMaterial(mat);
      }
    }

    function setUnit(unit) {
      currentUnit = unit;
      document.querySelectorAll('.segment-control button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.unit-badge').forEach(e => e.textContent = unit);
      updateDieline();
    }

    function triggerExport(format) {
      if (!currentBoxData) return;
      const filename = `melano-${currentBoxStyle}-${Date.now()}.${format}`;

      if (format === 'svg') window.dielineExporter.exportSVG(currentBoxData, filename);
      if (format === 'pdf') window.dielineExporter.exportPDF(currentBoxData, filename);
      if (format === 'dxf') window.dielineExporter.exportDXF(currentBoxData, filename);
      if (format === 'png') {
        const svgEl = document.querySelector('#cad-canvas svg');
        if (svgEl) window.dielineExporter.exportPNG(svgEl, filename);
      }

      showToast(`تم تصدير ملف ${format.toUpperCase()} بنجاح ✨`);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
