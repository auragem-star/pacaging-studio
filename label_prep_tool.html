function extractJSON(raw) {
  const clean = raw.replace(/```json/g, "").replace(/```/g, "").trim();
  const s = clean.indexOf("{");
  const e = clean.lastIndexOf("}");
  if (s === -1 || e === -1 || e <= s) throw new Error("no-json");
  return JSON.parse(clean.slice(s, e + 1));
}

/* Provider key lives in memory only — never written into the file. */
let GEMINI_KEY = "";
const setGeminiKey = (k) => { GEMINI_KEY = (k || "").trim(); };

async function askGemini(system, user) {
  const url =
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" +
    encodeURIComponent(GEMINI_KEY);

  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `${system}\n\n---\n\nInput:\n${user}` }] }],
        generationConfig: {
          responseMimeType: "application/json",
          maxOutputTokens: 2048,
          temperature: 0.7,
        },
      }),
    });
  } catch (netErr) {
    throw new Error("network: " + (netErr.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try {
      const body = await res.json();
      detail = body?.error?.message || "";
    } catch { /* body was not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  const raw = (j?.candidates?.[0]?.content?.parts || [])
    .map((p) => p.text || "")
    .join("");
  if (!raw.trim()) throw new Error("empty response");
  return extractJSON(raw);
}

async function askClaude(system, user) {
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          { role: "user", content: `${system}\n\n---\n\nInput:\n${user}` },
          { role: "assistant", content: "{" },
        ],
      }),
    });
  } catch (netErr) {
    throw new Error("network: " + (netErr.message || "fetch failed"));
  }

  if (!res.ok) {
    let detail = "";
    try {
      const body = await res.json();
      detail = body?.error?.message || "";
    } catch { /* body was not json */ }
    throw new Error(`http ${res.status}${detail ? ": " + detail : ""}`);
  }

  const j = await res.json();
  if (j.error) throw new Error(j.error.message || "api-error");

  const raw = (j.content || []).map((c) => (c.type === "text" ? c.text : "")).join("");
  if (!raw.trim()) throw new Error("empty response");

  // The assistant turn was prefilled with "{", so it is not part of the reply.
  const whole = raw.trim().startsWith("{") ? raw : "{" + raw;

  if (j.stop_reason === "max_tokens") {
    try {
      return extractJSON(whole);
    } catch {
      throw new Error("truncated");
    }
  }
  return extractJSON(whole);
}

async function askModel(system, user) {
  if (GEMINI_KEY) return askGemini(system, user);
  return askClaude(system, user);
}

async function askClaudeRetry(system, user, tries = 2) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      return await askModel(system, user);
    } catch (e) {
      last = e;
      const m = e.message || "";
      // A malformed or truncated reply is worth one more shot; a bad request is not.
      const retryable = m.includes("no-json") || m.includes("empty") ||
                        m.includes("network") || m.startsWith("http 5") ||
                        m.includes("overloaded") || m.startsWith("http 429");
      if (!retryable || i === tries - 1) throw last;
      await new Promise((r) => setTimeout(r, 900));
    }
  }
  throw last;
}

function friendlyError(e) {
  const m = (e && e.message) || "";
  if (m === "truncated") return "الوصف طويل فالرد اتقطع. اختصر الوصف وجرّب تاني.";
  if (m.includes("no-json")) return "الرد رجع بشكل مش متوقع. جرّب تاني.";
  if (m.includes("network")) return "مفيش اتصال بالسيرفر. اتأكد من النت وجرّب تاني.";
  if (m.startsWith("http 429")) return "الطلبات كتير دلوقتي. استنى شوية وجرّب تاني.";
  if (m.startsWith("http 4")) return "الطلب اترفض: " + m;
  if (m.startsWith("http 5")) return "السيرفر مش راد دلوقتي. جرّب تاني بعد شوية.";
  return "حصلت مشكلة: " + (m || "سبب غير معروف");
}

function parseBrief(text) {
  const t = (text || "").trim();
  const flat = t.replace(/\s+/g, " ");

  // Product name: first chunk before an em-dash, colon or full stop.
  let name = (t.split(/\n/)[0] || t).split(/—|--| - |[:.]/)[0].trim();
  if (name.length > 60) name = name.slice(0, 60).trim();
  if (!name) name = "Product";

  // Ingredients: everything after an ingredients marker.
  let ingredients = [];
  const m = flat.match(/(?:ingredients|المكونات|مكونات)\s*[:：]\s*([^.]+)/i);
  if (m) {
    ingredients = m[1]
      .split(/[,،؛;]/)
      .map((x) => x.replace(/\band\b|\bو\b/gi, "").trim())
      .filter((x) => x.length > 1 && x.length < 48)
      .slice(0, 8);
  }

  const has = (re) => re.test(flat);
  const traits = {
    cooling: has(/cool|cold|freeze|menthol|بارد|تبريد|منثول/i),
    warming: has(/warm|heat|hot|دافئ|تدفئة|سخون/i),
    pain: has(/pain|ache|sore|muscle|joint|ألم|وجع|عضل|مفصل/i),
    skin: has(/skin|derma|face|cream|بشرة|جلد|وجه|كريم/i),
    hair: has(/hair|scalp|شعر|فروة/i),
    spray: has(/spray|mist|سبراي|بخاخ|رش/i),
    natural: has(/natural|herbal|botanic|organic|طبيعي|عشبي|نباتي/i),

function Dieline({ items, face }) {
  const W = 300;
  const H = 640;
  const M = 26;
  const inner = { x: M, y: M, w: W - M * 2, h: H - M * 2 };
  const kColor = {
    logo: "#C8005E", name: "#C8005E", art: "#0091B3",
    badge: "#B87400", volume: "#5C6169",
  };
  const list = items && items.length ? items : [];
  const gap = 7;
  const avail = inner.h - gap * (list.length - 1 || 0);
  const weight = (k) =>
    k === "logo" ? 2.1 : k === "name" ? 1.5 : k === "art" ? 2.4 :
    k === "body" || k === "warning" ? 1.9 : k === "volume" ? 0.7 : 1;
  const total = list.reduce((s, e) => s + weight(e.k), 0) || 1;

  let cursor = inner.y;
  const boxes = list.map((e) => {
    const h = (weight(e.k) / total) * avail;
    const b = { ...e, y: cursor, h };
    cursor += h + gap;
    return b;
  });

  const crop = (x, y, dx, dy) => (
    <g stroke="#16181C" strokeWidth="1">
      <line x1={x} y1={y} x2={x + dx * 13} y2={y} />
      <line x1={x} y1={y} x2={x} y2={y + dy * 13} />
    </g>
  );

  return (
    <svg className="lp-dl" viewBox={`0 0 ${W} ${H}`} role="img"
         aria-label={face === "front" ? "معاينة وش العبوة" : "معاينة ضهر العبوة"}>
      {crop(6, 6, 1, 1)}
      {crop(W - 6, 6, -1, 1)}
      {crop(6, H - 6, 1, -1)}
      {crop(W - 6, H - 6, -1, -1)}

      <rect x={14} y={14} width={W - 28} height={H - 28}
            fill="none" stroke="#C3C7C0" strokeWidth="1" strokeDasharray="4 4" />
      <rect x={inner.x} y={inner.y} width={inner.w} height={inner.h}
            fill="#F7F8F6" stroke="#16181C" strokeWidth="1.5" />

      {boxes.map((b, i) => {
        const c = kColor[b.k] || "#5C6169";
        const isArt = b.k === "art";
        return (
          <g key={i}>
            <rect x={inner.x + 9} y={b.y + 3} width={inner.w - 18} height={Math.max(b.h - 6, 10)}
                  fill={isArt ? "#0091B3" : "none"} fillOpacity={isArt ? 0.07 : 0}
                  stroke={c} strokeWidth="1" strokeDasharray={isArt ? "0" : "3 3"} />
            <text x={W / 2} y={b.y + Math.max(b.h, 12) / 2 + 3.5}
                  textAnchor="middle" fill={c}
                  style={{ font: "500 8.5px 'IBM Plex Mono', monospace" }}>
              {(b.t || "").slice(0, 30)}
            </text>
          </g>
        );
      })}

      <text x={W / 2} y={H - 3} textAnchor="middle" fill="#5C6169"
            style={{ font: "500 8px 'IBM Plex Mono', monospace", letterSpacing: "0.12em" }}>
        {face === "front" ? "FRONT — TRIM + BLEED" : "BACK — TRIM + BLEED"}
      </text>
    </svg>
  );
}

function readable(hex) {
  const h = (hex || "#888888").replace("#", "");
  if (h.length !== 6) return "#16181C";
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#16181C" : "#FFFFFF";
}

  const zones = concept.zones || [];

  const gap = 8;
  const avail = H - pad * 2 - gap * (zones.length - 1 || 0);
  const total = zones.reduce((s, z) => s + (Number(z.h) || 1), 0) || 1;

  let y = pad;
  const boxes = zones.map((z) => {
    const h = ((Number(z.h) || 1) / total) * avail;
    const w = Math.min(Math.max(Number(z.w) || 0.8, 0.25), 1) * (W - pad * 2);
    const x =
      z.align === "start" ? pad :
      z.align === "end" ? W - pad - w :
      pad + (W - pad * 2 - w) / 2;
    const b = { ...z, x, y, w, h };
    y += h + gap;
    return b;
  });

  const fillFor = (t) =>
    t === "accent" ? accent : t === "dark" ? accent2 : "#FFFFFF";
  const opacityFor = (t) => (t === "light" ? 0.55 : 0.92);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", maxWidth: 340, border: "1px solid #C3C7C0" }}
         role="img" aria-label="تصور بصري مبدئي للملصق">
      <rect x="0" y="0" width={W} height={H} fill={bg} />
      {boxes.map((b, i) => {
        const isArt = b.role === "art";
        const f = fillFor(b.tone);
        const txt = readable(b.tone === "light" ? bg : f);
        return (
          <g key={i}>
            <rect x={b.x} y={b.y} width={b.w} height={Math.max(b.h, 9)}
                  fill={f} fillOpacity={opacityFor(b.tone)}
                  stroke={isArt ? accent : "none"} strokeWidth={isArt ? 1 : 0}
                  strokeDasharray={isArt ? "4 3" : "0"} />
            <text x={b.x + b.w / 2} y={b.y + Math.max(b.h, 12) / 2 + 3.5}
                  textAnchor="middle" fill={txt}
                  style={{
                    font: `${b.role === "name" || b.role === "brand" ? 700 : 500} ${
                      b.role === "name" ? 12 : b.role === "brand" ? 10.5 : 8.5
                    }px 'IBM Plex Sans Condensed', sans-serif`,
                    letterSpacing: b.role === "brand" ? "0.1em" : "0",
                  }}>
              {(b.label || "").slice(0, 26)}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function LabelPrepTool() {
  const [desc, setDesc] = useState("");
  const [data, setData] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [stage, setStage] = useState("");
  const [localMode, setLocalMode] = useState(false);
  const [apiKey, setApiKey] = useState("");
  const [showKey, setShowKey] = useState(false);

  const onKeyChange = (v) => {
    setApiKey(v);
    setGeminiKey(v);
  };
  const [tab, setTab] = useState("split");
  const [copied, setCopied] = useState("");

  // Feature 1 — Visual AI Director
  const [director, setDirector] = useState(null);
  const [dirBusy, setDirBusy] = useState(false);
  const [dirErr, setDirErr] = useState("");
  const [oneBusy, setOneBusy] = useState(-1);

  // Feature 2 — Label Concept Generator
  const [brand, setBrand] = useState("");
  const [style, setStyle] = useState(STYLES[0]);
  const [scope, setScope] = useState("front");
  const [concept, setConcept] = useState(null);
  const [conBusy, setConBusy] = useState(false);
  const [conErr, setConErr] = useState("");

  const run = async () => {
    const input = desc.trim();
    if (!input) return;
    setBusy(true); setErr(""); setData(null);

    let split, prompts, usedLocal = false;

    try {
      setStage("بيقسّم العناصر…");
      split = await askClaudeRetry(SYS_SPLIT, input);
    } catch {
      split = localSplit(input);
      usedLocal = true;
    }

    try {
      setStage("بيكتب البرومبتات…");
      const r = await askClaudeRetry(SYS_PROMPTS, input);
      prompts = r.prompts || [];
      if (!prompts.length) throw new Error("empty");
    } catch {
      prompts = localPrompts(input).prompts;
      usedLocal = true;
    }

    setData({ ...split, prompts });
    setLocalMode(usedLocal);
    setDirector(null); setDirErr("");
    setConcept(null); setConErr("");
    setTab("split");
    setBusy(false);
    setStage("");
  };

  const copy = async (text, key) => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(key);
      setTimeout(() => setCopied(""), 1600);
    } catch { /* clipboard unavailable */ }
  };

  // --- Feature 1 handlers ---
  const productBrief = () => {
    const p = data?.product?.en ? `Product: ${data.product.en}\n` : "";
    return `${p}${desc.trim()}`;
  };

  const runDirector = async () => {
    setDirBusy(true); setDirErr("");
    try {
      const r = await askClaudeRetry(SYS_DIRECTOR, productBrief());
      const items = r.items || [];
      setDirector(items.length ? items : localDirector(desc).items);
      if (!items.length) setLocalMode(true);
    } catch {
      setDirector(localDirector(desc).items);
      setLocalMode(true);
    } finally {
      setDirBusy(false);
    }
  };

  const regenOne = async (i) => {
    const cur = director[i];
    setOneBusy(i);
    try {
      const r = await askClaudeRetry(
        SYS_DIRECTOR_ONE,
        `${productBrief()}\n\nCurrent proposal to replace:\n${JSON.stringify(cur)}`
      );
      if (r.item) {
        const next = director.slice();
        next[i] = r.item;
        setDirector(next);
      }
    } catch { /* keep the existing item */ }
    finally { setOneBusy(-1); }
  };

  // --- Feature 2 handlers ---
  const runConcept = async () => {
    setConBusy(true); setConErr("");
    const scopeLabel = SCOPES.find((s) => s.id === scope)?.label || "Front Label Concept";
    const ing = (data?.back || [])
      .filter((e) => e.k === "ingredients")
      .map((e) => e.t).join(", ");
    const assets = (director || []).map((d) => d.name).join(", ");
    const brief = [
      productBrief(),
      brand ? `Brand name: ${brand}` : "",
      ing ? `Key ingredients: ${ing}` : "",
      assets ? `Proposed visual assets: ${assets}` : "",
      `Design style: ${style}`,
      `Scope: ${scopeLabel}`,
      concept ? "Give a DIFFERENT visual direction from the previous one." : "",
    ].filter(Boolean).join("\n");
    try {
      const r = await askClaudeRetry(SYS_CONCEPT, brief);
      if (!r || !(r.zones || []).length) throw new Error("empty");
      setConcept(r);
    } catch {
      setConcept(localConcept(desc, style, scope, brand));
      setLocalMode(true);
    } finally {
      setConBusy(false);
    }
  };

  const sample = `Melano Massage Spray — topical massage spray with soothing oils and Menthol. Cooling and warming dual action, for joints and muscles pain. Ingredients: Eucalyptus Oil, Turpentine Oil, Methyl Salicylate, Menthol Crystals.`;

  const Face = ({ title, items }) => (
    <div className="lp-face">
      <div className="lp-facehead">
        <span>{title}</span>
        <span>{items.length} EL</span>
      </div>
      {items.map((e, i) => (
        <div className="lp-el" key={i}>
          <div className="lp-elnum">{String(i + 1).padStart(2, "0")}</div>
          <div className="lp-elbody">
            <div className="lp-elen">{e.t}</div>
            {e.ar ? <div className="lp-elar">{e.ar}</div> : null}
            {e.n ? <div className="lp-elnote">{e.n}</div> : null}
          </div>
          <span className="lp-tag">{e.k}</span>
        </div>
      ))}
    </div>
  );

  return (
    <div className="lp-root">
      <style>{CSS}</style>
      <div className="lp-shell">

        <header className="lp-head">
          <div>
            <h1 className="lp-title">تجهيز عناصر الاستيكر</h1>
            <p className="lp-sub">
              الصق وصف المنتج، وهتطلع بتقسيم العناصر لوش وضهر، برومبتات جاهزة
              لأداة توليد الصور، ومعاينة مبدئية لشكل الملصق قبل ما المصمم يبدأ.
            </p>
          </div>
          <div className="lp-stamp">LABEL PREP / v1</div>
        </header>

        <div className="lp-inputwrap">
          <label className="lp-label" htmlFor="apikey">
            مفتاح Gemini (اختياري)
          </label>
          <p className="lp-hint">
            من غير مفتاح الأداة شغالة بالمحرّك المحلي. مع المفتاح الصياغة بتبقى أذكى.
            المفتاح بيفضل في المتصفح بتاعك بس ومش بيتحفظ في الملف — كل واحد يحط مفتاحه.
          </p>
          <div className="lp-row" style={{ marginTop: 0 }}>
            <input
              id="apikey"
              className="lp-ta"
              type={showKey ? "text" : "password"}
              style={{ minHeight: 0, height: 42, flex: "1 1 240px", direction: "ltr", textAlign: "left" }}
              value={apiKey}
              onChange={(e) => onKeyChange(e.target.value)}
              placeholder="AIza…"
              autoComplete="off"
              spellCheck="false"
            />
            <button className="lp-btn lp-btn-ghost" onClick={() => setShowKey((v) => !v)}>
              {showKey ? "إخفاء" : "إظهار"}
            </button>
          </div>
        </div>

        <div className="lp-inputwrap">
          <label className="lp-label" htmlFor="desc">وصف المنتج</label>
          <p className="lp-hint">
            اكتب الاسم، الاستخدام، المكونات، وأي ادعاءات على العبوة. عربي أو إنجليزي أو الاتنين.
          </p>
          <textarea
            id="desc"
            className="lp-ta"
            value={desc}
            onChange={(e) => setDesc(e.target.value)}
            placeholder="مثال: سبراي مساج موضعي بزيوت مهدئة ومنثول، لألم المفاصل والعضلات، بمفعول تبريد وتدفئة…"
          />
          <div className="lp-row">
            <button className="lp-btn" onClick={run} disabled={busy || !desc.trim()}>
              {busy ? (stage || "بيجهّز…") : "جهّز العناصر"}
            </button>
            <button className="lp-btn lp-btn-ghost" onClick={() => setDesc(sample)} disabled={busy}>
              جرّب بمثال
            </button>
          </div>
          {err ? <div className="lp-err">{err}</div> : null}
        </div>

        {data && localMode ? (
          <p className="lp-eyebrow" style={{ marginTop: -2, marginBottom: 18 }}>
            اتولّد محليًا — <b>من غير AI</b>
          </p>
        ) : null}

        {data ? (
          <>
            <div className="lp-tabs" role="tablist">
              <button className="lp-tab" data-on={tab === "split" ? 1 : 0}
                      onClick={() => setTab("split")} role="tab" aria-selected={tab === "split"}>
                تقسيم العناصر
                <span>{(data.front?.length || 0) + (data.back?.length || 0)}</span>
              </button>
              <button className="lp-tab" data-on={tab === "prompts" ? 1 : 0}
                      onClick={() => setTab("prompts")} role="tab" aria-selected={tab === "prompts"}>
                برومبتات الرسومات
                <span>{data.prompts?.length || 0}</span>
              </button>
              <button className="lp-tab" data-on={tab === "dieline" ? 1 : 0}
                      onClick={() => setTab("dieline")} role="tab" aria-selected={tab === "dieline"}>
                معاينة الملصق
              </button>
              <button className="lp-tab" data-on={tab === "director" ? 1 : 0}
                      onClick={() => setTab("director")} role="tab" aria-selected={tab === "director"}>
                Visual AI Director
                {director ? <span>{director.length}</span> : null}
              </button>
              <button className="lp-tab" data-on={tab === "concept" ? 1 : 0}
                      onClick={() => setTab("concept")} role="tab" aria-selected={tab === "concept"}>
                Label Concept
              </button>
            </div>

            {tab === "split" ? (
              <>
                <p className="lp-eyebrow">
                  المنتج <b>{data.product?.en || "—"}</b>
                </p>
                <div className="lp-facegrid">
                  <Face title="FRONT / الوش" items={data.front || []} />
                  <Face title="BACK / الضهر" items={data.back || []} />
                </div>
                <p className="lp-note">
                  كل سطر هنا عنصر مستقل. المصمم بيحوّل كل واحد لملف TIFF بخلفية شفافة
                  على 300 DPI، وبيرصّهم في الإليستريتور حسب المعاينة.
                </p>
              </>
            ) : null}

            {tab === "prompts" ? (
              <>
                <p className="lp-eyebrow">
                  انسخ البرومبت زي ما هو في أداة توليد الصور
                </p>
                {!(data.prompts || []).length ? (
                  <div className="lp-err">
                    البرومبتات مجتش المرة دي. اضغط «جهّز العناصر» تاني — التقسيم هيفضل زي ما هو.
                  </div>
                ) : null}
                {(data.prompts || []).map((p, i) => (
                  <div className="lp-prompt" key={i}>
                    <div className="lp-phead">
                      <h3 className="lp-ptitle">{p.title}</h3>
                      <button className="lp-btn lp-btn-ghost" onClick={() => copy(p.p, "pr" + i)}>
                        {copied === "pr" + i ? "اتنسخ" : "Copy Prompt"}
                      </button>
                    </div>
                    <p className="lp-pplace">
                      <strong>{p.face === "front" ? "الوش" : "الضهر"}</strong> — {p.place}
                    </p>
                    <div className="lp-ptext">{p.p}</div>
                  </div>
                ))}
                <p className="lp-note">
                  لو الأداة مش بتطلع خلفية شفافة، غيّر آخر البرومبت لـ pure white background
                  وشيلها بعدين من الإليستريتور.
                </p>
              </>
            ) : null}

            {tab === "dieline" ? (
              <>
                <p className="lp-eyebrow">
                  ملصق لف حول العبوة — <b>مرجع ترتيب فقط</b>
                </p>
                <div className="lp-dlwrap">
                  <div className="lp-dlcol">
                    <div className="lp-dlcap">Front / الوش</div>
                    <Dieline items={data.front || []} face="front" />
                  </div>
                  <div className="lp-dlcol">
                    <div className="lp-dlcap">Back / الضهر</div>
                    <Dieline items={data.back || []} face="back" />
                  </div>
                </div>
                <div className="lp-legend">
                  <span className="lp-lgi">
                    <span className="lp-sw" style={{ borderColor: "#C8005E", borderStyle: "dashed" }} />
                    نصوص أساسية
                  </span>
                  <span className="lp-lgi">
                    <span className="lp-sw" style={{ borderColor: "#0091B3", background: "rgba(0,145,179,0.07)" }} />
                    رسومات من الـ AI
                  </span>
                  <span className="lp-lgi">
                    <span className="lp-sw" style={{ borderColor: "#B87400", borderStyle: "dashed" }} />
                    بادچ / ادعاء
                  </span>
                </div>
                <p className="lp-note">
                  الأبعاد هنا نسبية مش نهائية — المصمم بيظبطها على محيط وطول العبوة الحقيقي.
                  الخط المنقّط الخارجي هو حد الـ bleed، والخط الصريح هو خط القص.
                </p>
              </>
            ) : null}

            {tab === "director" ? (
              <>
                <p className="lp-eyebrow">
                  العناصر البصرية اللي المنتج ده <b>محتاجها فعلًا</b>
                </p>

                {!director ? (
                  <div className="lp-ctrl">
                    <p className="lp-hint" style={{ marginBottom: 12 }}>
                      هيتحلل نوع المنتج ومكوناته وجمهوره، ويترشّح العناصر البصرية المناسبة له —
                      كل عنصر بسبب اقتراحه ووظيفته ومكانه وبرومبت مستقل.
                    </p>
                    <button className="lp-btn" onClick={runDirector} disabled={dirBusy}>
                      {dirBusy ? "بيحلل المنتج…" : "اقترح العناصر البصرية"}
                    </button>
                  </div>
                ) : null}

                {director ? (
                  <>
                    {director.map((it, i) => (
                      <div className="lp-vd" key={i}>
                        <div className="lp-vdhead">
                          <div style={{ minWidth: 0 }}>
                            <span className="lp-vdkind">{it.kind}</span>
                            <h3 className="lp-vdname">{it.name}</h3>
                          </div>
                          <button className="lp-btn lp-btn-ghost"
                                  onClick={() => regenOne(i)} disabled={oneBusy === i}>
                            {oneBusy === i ? "بيولّد…" : "اقتراح تاني"}
                          </button>
                        </div>

                        <dl className="lp-vdmeta">
                          <div className="lp-vdcell">
                            <dt>ليه المنتج ده</dt>
                            <dd>{it.why}</dd>
                          </div>
                          <div className="lp-vdcell">
                            <dt>وظيفته في التصميم</dt>
                            <dd>{it.role}</dd>
                          </div>
                          <div className="lp-vdcell">
                            <dt>مكانه المقترح</dt>
                            <dd>{it.place}</dd>
                          </div>
                        </dl>

                        <div className="lp-vdfoot">
                          <div className="lp-phead">
                            <span style={{
                              fontFamily: "'IBM Plex Mono', monospace", fontSize: 9.5,
                              letterSpacing: "0.12em", textTransform: "uppercase", color: "#5C6169",
                            }}>Prompt</span>
                            <button className="lp-btn lp-btn-ghost"
                                    onClick={() => copy(it.p, "vd" + i)}>
                              {copied === "vd" + i ? "اتنسخ" : "Copy Prompt"}

                          </div>

                    ))}

                    <div className="lp-row">
                      <button className="lp-btn lp-btn-ghost" onClick={runDirector} disabled={dirBusy}>

                      </button>
                    </div>

                    <p className="lp-note">
                      «اقتراح تاني» بيغيّر العنصر ده لوحده ويسيب الباقي زي ما هو.
                      البرومبتات مكتوبة من غير أي كتابة أو شعارات جوه الصورة عشان تنفع تتحط في التصميم.
                    </p>
                  </>
                ) : null}
              </>
            ) : null}

            {tab === "concept" ? (
              <>
                <p className="lp-eyebrow">
                  تصور بصري مبدئي — <b>مرجع إبداعي فقط</b>

                  <strong>AI Visual Concept / Design Reference Only.</strong>{" "}

                  <input

                    {STYLES.map((s) => (

                      <div className="lp-dir">

                {concept ? (

                  </p>
                ) : null}
              </>
            ) : null}
          </>
        ) : null}

      </div>
    </div>
  );
}
